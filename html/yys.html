<title>Yetkinlik Yönetim Sistemi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sol sabit menü + çalışma alanı; yoğun tablo ve form odaklı araç, kart yalnız "nesne" olan blokta */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --fg:#17202a; --muted:#5b6774; --line:#d9e0e7;
  --brand:#0b3d62; --brand-2:#2a7fb8; --brand-soft:#e3eef7;
  --ok:#1f7a3a; --ok-soft:#e3f3e8; --warn:#9a6200; --warn-soft:#fff3d6; --bad:#b42318; --bad-soft:#fde8e6;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f161d;--surface:#172029;--fg:#e8edf2;--muted:#9aa8b6;--line:#2a3743;--brand:#9cc9ea;--brand-2:#5aa6dc;--brand-soft:#1b2f40;--ok:#6fcf8a;--ok-soft:#163421;--warn:#e8b84a;--warn-soft:#3b2d0c;--bad:#f28b82;--bad-soft:#3f1a17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f161d;--surface:#172029;--fg:#e8edf2;--muted:#9aa8b6;--line:#2a3743;--brand:#9cc9ea;--brand-2:#5aa6dc;--brand-soft:#1b2f40;--ok:#6fcf8a;--ok-soft:#163421;--warn:#e8b84a;--warn-soft:#3b2d0c;--bad:#f28b82;--bad-soft:#3f1a17;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;margin:0;min-height:100%}
#app{display:flex;min-height:100vh}
nav.side{width:232px;flex:0 0 232px;background:var(--brand);color:#fff;padding:16px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
:root[data-theme="dark"] nav.side, :root:not([data-theme="light"]) nav.side{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.side{background:#0b2a44}}
:root[data-theme="dark"] nav.side{background:#0b2a44}
nav.side .brand{font-weight:700;margin-bottom:10px;line-height:1.2}
nav.side .brand small{display:block;font-weight:400;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
nav.side a{color:#fff;text-decoration:none;padding:7px 10px;border-radius:6px;font-size:13.5px;display:block}
nav.side a:hover{background:rgba(255,255,255,.1)}
nav.side a.active{background:rgba(255,255,255,.18);font-weight:600}
nav.side .group{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.65;margin:10px 10px 2px}
nav.side .who{margin-top:auto;border-top:1px solid rgba(255,255,255,.25);padding-top:10px;font-size:12px}
nav.side select{width:100%;margin-top:4px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:6px}
nav.side select option{color:#17202a}
main{flex:1;min-width:0;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:none}
@media (max-width:860px){#app{flex-direction:column}nav.side{position:static;width:auto;height:auto;flex-direction:row;flex-wrap:wrap;gap:4px}nav.side .group{display:none}nav.side .who{margin-top:0;border:0;padding:0;width:100%}nav.side .brand{width:100%}}
h1{font-size:22px;margin:0 0 4px;color:var(--brand);text-wrap:balance}
h2{font-size:16px;margin:0 0 8px}
h3{font-size:14px;margin:0 0 6px}
p{margin:0 0 8px}
.lead{color:var(--muted);max-width:72ch;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card.current{border-color:var(--brand-2);box-shadow:0 0 0 2px var(--brand-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile .k{font-size:12px;color:var(--muted)}.tile .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;background:var(--brand-soft);color:var(--brand);padding:6px 8px;font-weight:600}
td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
tr.hl td{background:var(--warn-soft)}
.tbl{overflow-x:auto}
.btn{font:inherit;font-size:13px;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--brand-2)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.p{color:#0b2a44}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.p{color:#0b2a44}}
.btn.s{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--brand-2);outline-offset:1px}
input,select,textarea{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);width:100%}
input[type=checkbox]{width:auto}
label{font-size:12.5px;color:var(--muted);display:block}
label>input,label>select,label>textarea{margin-top:3px}
.form{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
.form .wide{grid-column:1/-1}
.badge{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:500;background:var(--brand-soft);color:var(--brand)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.mute{background:var(--line);color:var(--muted)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:var(--mono);font-size:12px}
.msg{padding:8px 10px;border-radius:6px;margin:8px 0;font-size:13px}.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.bad{background:var(--bad-soft);color:var(--bad)}.msg.warn{background:var(--warn-soft);color:var(--warn)}
.bar{height:8px;background:var(--line);border-radius:4px;width:96px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand-2)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.steps span{border-radius:999px;padding:3px 10px;font-size:12px;background:var(--line);color:var(--muted)}
.steps span.done{background:var(--ok-soft);color:var(--ok)}.steps span.cur{background:var(--brand);color:#fff}
details>summary{cursor:pointer;font-weight:600}
.tree ul{list-style:none;margin:0;padding-left:16px;border-left:1px solid var(--line)}.tree>ul{padding-left:0;border:0}
.tree li{margin:3px 0}
.heat td.c{text-align:center;font-variant-numeric:tabular-nums}
.c.g{background:var(--ok-soft)}.c.y{background:var(--warn-soft)}.c.r{background:var(--bad-soft)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:var(--surface);border-radius:8px;padding:16px;max-width:460px;width:100%}
.pick{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px;font-size:13px}
.pick label{display:flex;gap:6px;align-items:flex-start;color:var(--fg);margin:3px 0}
.pick .lv{font-family:var(--mono);font-size:11px;background:var(--line);border-radius:4px;padding:0 4px;white-space:nowrap}
textarea.json{font-family:var(--mono);font-size:11.5px;min-height:140px}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .15s}}
</style>
<div id="app">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>
<div id="modal"></div>
<script>
// ===================== Veri ve kalıcılık =====================
const KEY = "yys_v0";
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const today = () => new Date().toISOString().slice(0, 10);
const LEVELS = {
  TEKNIK: ["Yok / Uygulanamaz", "Başlangıç", "Uygulayıcı", "Yetkin Uygulayıcı", "Yöneten", "Yön Veren"],
  DAVRANISSAL: ["Yok / Uygulanamaz", "Gelişmekte", "Uygular", "Güçlü", "Rol model", "Kültür taşıyıcı"],
};
const LEVEL_DEF = ["—", "Temel kavramları bilir, yakın gözetimle basit görevleri yapar", "Standart görevleri bağımsız yapar; rutin dışı durumda destek ister", "Karmaşık/rutin dışı görevleri bağımsız çözer; başkalarına rehberlik eder", "Alanın standardını belirler; başkalarını geliştirir; süreci iyileştirir", "Kurum çapında yön verir; yeni yaklaşımlar geliştirir; dış referans uzmanıdır"];
const EVTYPES = [["IS_CIKTISI", "İş çıktısı (rapor, tasarım, doküman)"], ["PROJE_GOREV", "Proje / görev kaydı"], ["GOZLEM_NOTU", "Yönetici gözlem notu"], ["SERTIFIKA_SINAV", "Sertifika / sınav"], ["PAYDAS_GERI_BILDIRIM", "Paydaş geri bildirimi"], ["OLCULEBILIR_SONUC", "Ölçülebilir sonuç"], ["MENTORLUK_KAYDI", "Mentorluk / eğitim verme kaydı"]];
const EV_STATUS = { TASLAK: "Taslak", SUNULDU: "Sunuldu", KABUL: "Kabul", EK_BILGI: "Ek bilgi istendi", RED: "Red" };
const CYCLE_STATUS = ["HAZIRLIK", "OZ_BEYAN", "YONETICI", "MUTABAKAT", "KALIBRASYON", "KILITLI"];
const CYCLE_LABEL = { HAZIRLIK: "Hazırlık", OZ_BEYAN: "Öz-beyan", YONETICI: "Yönetici doğrulaması", MUTABAKAT: "Mutabakat", KALIBRASYON: "Kalibrasyon", KILITLI: "Kilitli" };
const A_LABEL = { ACILDI: "Açıldı", OZ_BEYAN_TAMAM: "Öz-beyan tamam", YONETICI_TAMAM: "Doğrulama tamam", UST_DOGRULAMADA: "Üst doğrulamada (S5)", MUTABAKATTA: "Mutabakatta", ITIRAZDA: "İtirazda", KESINLESTI: "Kesinleşti", KILITLI: "Kilitli" };
const SUBKIND = { CEKIRDEK: "Çekirdek", LIDERLIK: "Liderlik", YAZILIM_ARAC: "Yazılım / Araç", MEVZUAT_STANDART: "Mevzuat / Standart", SUREC_METODOLOJI: "Süreç / Metodoloji", URUN_ALAN: "Ürün / Alan bilgisi", EKIPMAN_ISLEM: "Ekipman / İşlem", DIL: "Dil" };
const UNIT_TYPES = { DIREKTORLUK: "Grup Müdürlüğü / Direktörlük", DEPARTMAN: "Müdürlük", SERVIS: "Servis / Ekip" };

let S = null;
function emptyState() {
  return { version: 1, createdAt: new Date().toISOString(), units: [], roles: [], people: [], competencies: [], profiles: [], evidence: [], cycles: [], plans: [], stages: {}, audit: [], currentUser: "admin", example: false };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* depolama kapalı olabilir */ } }
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { S = JSON.parse(raw); return; } } catch (e) {}
  S = emptyState(); seedExample(); save();
}
function audit(action, detail) { S.audit.unshift({ at: new Date().toISOString(), by: S.currentUser, action, detail: detail || "" }); if (S.audit.length > 2000) S.audit.length = 2000; }

function sampleCompetency(code, name, kind, subKind, def, rows) {
  const levels = {};
  for (let l = 1; l <= 5; l++) levels[l] = { anchor: "", indicators: [] };
  rows.forEach(([l, text, mandatory, ev]) => levels[l].indicators.push({ id: uid(), text, mandatory, evidenceTypes: ev, validity: 24 }));
  return { id: uid(), code, name, kind, subKind, definition: def, boundary: "", criticality: 2, status: "AKTIF", version: 1, levels };
}
function seedExample() {
  S.example = true;
  const grup = { id: uid(), parentId: null, type: "DIREKTORLUK", name: "İnsan Kaynakları Grup Müdürlüğü", managerId: null };
  const m1 = { id: uid(), parentId: grup.id, type: "DEPARTMAN", name: "İşe Alım Müdürlüğü", managerId: null };
  const m2 = { id: uid(), parentId: grup.id, type: "DEPARTMAN", name: "Yetenek ve Yetkinlik Yönetimi", managerId: null };
  S.units.push(grup, m1, m2);
  const rGM = { id: uid(), name: "Grup Müdürü", family: "İK Yönetimi", grade: 6, isManager: true };
  const rM = { id: uid(), name: "Müdür", family: "İK Yönetimi", grade: 5, isManager: true };
  const rU = { id: uid(), name: "İK Uzmanı", family: "İnsan Kaynakları", grade: 2, isManager: false };
  const rUY = { id: uid(), name: "İK Uzman Yardımcısı", family: "İnsan Kaynakları", grade: 1, isManager: false };
  S.roles.push(rGM, rM, rU, rUY);
  const p = (no, name, unitId, roleId) => ({ id: uid(), no, name, email: "", unitId, roleId, active: true });
  const gm = p("1001", "Ayşe Yılmaz (örnek)", grup.id, rGM.id);
  const md1 = p("2001", "Can Aydın (örnek)", m1.id, rM.id);
  const md2 = p("2002", "Elif Kaya (örnek)", m2.id, rM.id);
  const u1 = p("3001", "Zeynep Arslan (örnek)", m1.id, rU.id);
  const u2 = p("3002", "Mehmet Demir (örnek)", m1.id, rUY.id);
  const u3 = p("3003", "Selin Koç (örnek)", m2.id, rU.id);
  S.people.push(gm, md1, md2, u1, u2, u3);
  grup.managerId = gm.id; m1.managerId = md1.id; m2.managerId = md2.id;
  const c1 = sampleCompetency("D-C-01", "Sürekli Öğrenme", "DAVRANISSAL", "CEKIRDEK", "Yeni bilgi ve yöntemleri kendiliğinden arar, uygular ve paylaşır.", [
    [1, "Atanan zorunlu eğitimleri süresinde tamamladı", true, ["SERTIFIKA_SINAV"]], [1, "Yöneticisinin önerdiği bir öğrenme kaynağını bitirip kısa özetini paylaştı", false, ["IS_CIKTISI"]], [1, "Yeni bir mevzuat veya ürün değişikliğini sorarak öğrendi ve notlarını ekiple paylaştı", false, ["GOZLEM_NOTU"]],
    [2, "Kendi alanındaki bir mevzuat veya ürün değişikliğini işine yansıttı", true, ["IS_CIKTISI", "GOZLEM_NOTU"]], [2, "Son 12 ayda bir öğrenme etkinliğine kendi isteğiyle katıldı", false, ["SERTIFIKA_SINAV"]], [2, "Öğrendiği bir yöntemi bir iş çıktısında uyguladı", false, ["IS_CIKTISI"]],
    [3, "Kendi belirlediği bir öğrenme hedefini 12 ayda tamamladı", true, ["SERTIFIKA_SINAV", "IS_CIKTISI"]], [3, "Öğrendiği bir konuyu ekiple paylaştı (sunum, yazı veya atölye)", true, ["IS_CIKTISI", "MENTORLUK_KAYDI"]], [3, "Öğrendiğini işine uygulayıp ölçülebilir bir sonuç aldı", false, ["OLCULEBILIR_SONUC"]],
    [4, "Ekibi veya birimi için bir öğrenme programı ya da kılavuz tasarladı", true, ["IS_CIKTISI"]], [4, "En az iki kişiye mentorluk yaptı", false, ["MENTORLUK_KAYDI"]], [4, "Birimde bir öğrenme ritüeli başlattı ve sürdürdü", false, ["GOZLEM_NOTU"]],
    [5, "Kurum çapında bir öğrenme pratiği kurdu veya dış toplulukta içerik üretti", true, ["IS_CIKTISI", "PAYDAS_GERI_BILDIRIM"]], [5, "Başka birimlerin öğrenme programlarına danışmanlık yaptı", false, ["PAYDAS_GERI_BILDIRIM"]], [5, "Kurumun öğrenme stratejisine kabul edilen bir öneri geliştirdi", false, ["IS_CIKTISI"]]]);
  const c2 = sampleCompetency("D-C-02", "Süreç Odaklılık", "DAVRANISSAL", "CEKIRDEK", "İşi adımlar, standartlar ve iyileştirme döngüsü olarak görür.", [
    [1, "Tanımlı süreç adımlarını kontrol listesiyle takip etti", true, ["GOZLEM_NOTU"]], [1, "Süreç dokümanını okuyup kendi görevindeki adımları özetledi", false, ["IS_CIKTISI"]], [1, "Bir sapmayı fark edip yöneticisine bildirdi", false, ["GOZLEM_NOTU"]],
    [2, "Sürecindeki bir sapmayı tespit edip kayıt altına aldı", true, ["IS_CIKTISI"]], [2, "Süreç ölçümlerini (süre, hata) düzenli raporladı", false, ["IS_CIKTISI"]], [2, "Süreç değişikliğini ekibine aktardı", false, ["GOZLEM_NOTU"]],
    [3, "Sürecin darboğazını veriyle tespit edip iyileştirme önerdi ve uyguladı", true, ["IS_CIKTISI", "OLCULEBILIR_SONUC"]], [3, "İyileştirme sonrası ölçülebilir kazanım raporladı", false, ["OLCULEBILIR_SONUC"]], [3, "Yeni çalışana süreci öğretti", false, ["MENTORLUK_KAYDI"]],
    [4, "Birim için bir süreci baştan tasarladı ve standartlaştırdı", true, ["IS_CIKTISI"]], [4, "Süreç ölçüm sistemi kurdu ve birime raporladı", false, ["IS_CIKTISI"]], [4, "Birimler arası bir süreç arayüzünü netleştirdi", false, ["PAYDAS_GERI_BILDIRIM"]],
    [5, "Kurum çapında süreç mimarisine kabul edilen bir öneri geliştirdi", true, ["IS_CIKTISI"]], [5, "Sürekli iyileştirme programını kurum düzeyinde kurdu", false, ["IS_CIKTISI"]], [5, "Dış kıyaslama yapıp kuruma uyarladı", false, ["IS_CIKTISI"]]]);
  const c3 = sampleCompetency("T-IK-001", "İşe Alım ve Seçme Değerlendirme", "TEKNIK", "SUREC_METODOLOJI", "Rol profiline göre aday bulma, yapılandırılmış mülakat ve puan kartıyla değerlendirme, karar ve teklif süreçlerinin yürütülmesi.", [
    [1, "Rol profiline göre aday ön elemesini kontrol listesiyle yaptı", true, ["IS_CIKTISI"]], [1, "Mülakatlara gözlemci olarak katılıp puan kartı doldurdu", false, ["GOZLEM_NOTU"]], [1, "Aday iletişimini standart şablonla yürüttü", false, ["IS_CIKTISI"]],
    [2, "Standart bir pozisyonun işe alım sürecini bağımsız yürüttü", true, ["PROJE_GOREV"]], [2, "Yapılandırılmış mülakatı STAR yöntemiyle yürütüp puan kartını gerekçeli doldurdu", false, ["IS_CIKTISI"]], [2, "Süreç KPI'larını (süre, aday sayısı, kabul oranı) raporladı", false, ["OLCULEBILIR_SONUC"]],
    [3, "Kritik veya zor doldurulan bir pozisyonu bağımsız kapattı", true, ["PROJE_GOREV"]], [3, "Yeni mülakatçılara yapılandırılmış mülakat eğitimi verdi", false, ["MENTORLUK_KAYDI"]], [3, "İşe alım kalitesini (90. gün) izleyip raporladı", false, ["OLCULEBILIR_SONUC"]],
    [4, "Bir rol ailesi için seçme yöntemini (kılavuz, vaka, puan kartı) tasarladı", true, ["IS_CIKTISI"]], [4, "İşe alım sürecinde ölçülebilir iyileştirme sağladı", false, ["OLCULEBILIR_SONUC"]], [4, "İşe alım ekibini yönetip kalite standartlarını belirledi", false, ["GOZLEM_NOTU"]],
    [5, "Kurum işe alım politikasına kabul edilen bir yaklaşım geliştirdi", true, ["IS_CIKTISI"]], [5, "Dış kıyaslama ve araştırmayla seçme yöntemini yeniledi", false, ["IS_CIKTISI"]], [5, "İşe alım konusunda kurum dışı bir platformda içerik üretti", false, ["PAYDAS_GERI_BILDIRIM"]]]);
  S.competencies.push(c1, c2, c3);
  for (const r of S.roles) { S.profiles.push({ roleId: r.id, competencyId: c1.id, target: defaultBehTarget(r.grade, r.isManager, "CEKIRDEK"), weight: 2, mandatory: false }); S.profiles.push({ roleId: r.id, competencyId: c2.id, target: defaultBehTarget(r.grade, r.isManager, "CEKIRDEK"), weight: 2, mandatory: false }); }

    { key: "kalibrasyon", title: "Kalibrasyon ve kilit", summary: "Grup müdürü + müdürler oturumu; döngü kilitlenir ve anlık görüntü alınır.", guidance: ["Raporlarda dağılım ve cömertlik endeksine bakın; kalibrasyon seviye yükseltmez, kanıt görevi açar.", "Döngüyü kalibrasyon aşamasına alın, sonra kilitleyin."], link: "donguler",
      checks: [["Döngü kilitlendi", !!lc && lc.status === "KILITLI", lc ? CYCLE_LABEL[lc.status] : "döngü yok", true]] },
    { key: "raporlar", title: "Raporlar ve gelişim planı", summary: "Isı haritası, kalibrasyon bayrakları, öğrenim ölçütleri; kişi başı 3 öncelikli gelişim planı.", guidance: ["Raporlar sayfasında ısı haritası, dağılım, bus factor ve yönetici tutarlılığına bakın; sonuçları \"gelişim alanı\" diliyle paylaşın.", "Her çalışan ilk 3 önceliğinden eylem ekler (eksik gösterge = iş); yönetici planı onaylar.", "Öğrenim ölçütlerinin 7/9'u sağlanırsa genişleme kararı."], link: "raporlar",
      checks: [["Eylemi olan gelişim planı oranı ≥ %80", finalized > 0 && planned / finalized >= 0.8, finalized ? `${pct(planned / finalized)} (${planned}/${finalized})` : "kesinleşen değerlendirme yok", true], ["Yönetici onaylı plan oranı ≥ %80", finalized > 0 && approvedPlans / finalized >= 0.8, finalized ? pct(approvedPlans / finalized) : "—", false]] },
  ];
  st.forEach(s => { s.autoOk = s.checks.filter(c => c[3]).every(c => c[1]); s.confirmed = S.stages[s.key] || null; });
  let cur = st.findIndex(s => !s.confirmed); if (cur < 0) cur = st.length - 1;
  return { stages: st, current: cur };
}

// ===================== Ekranlar =====================
const V = {};
V.ozet = () => {
  const { stages, current } = computeStages();
  const people = S.people.filter(p => p.active);
  const tiles = [["Birim", S.units.length], ["Rol", S.roles.length], ["Kişi", people.length], ["Aktif yetkinlik", S.competencies.filter(c => c.status === "AKTIF").length], ["Kanıt", S.evidence.length], ["Bekleyen kanıt", S.evidence.filter(e => e.status === "SUNULDU").length]];
  let h = `<h1>Özet ve aşamalar</h1><p class="lead">Sistem şu anda <b>${current + 1}. aşamada: ${esc(stages[current].title)}</b>. Her aşamanın otomatik kontrolleri sağlanınca İK onaylar; sonraki aşama açılır. Kontroller tavsiyedir, önceki aşamaya her zaman dönülebilir.</p>`;
  if (S.example) h += `<div class="msg warn">Örnek veri yüklü (adların yanında "(örnek)"). Gerçek kuruluma başlarken <a href="#yedek" data-go="yedek">Yedek ve veri</a> sayfasından örnek veriyi temizleyin.</div>`;
  h += flashHtml();
  h += `<div class="grid" style="margin-bottom:14px">${tiles.map(([k, v]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>`;
  h += `<div class="steps">${stages.map((s, i) => `<span class="${s.confirmed ? "done" : i === current ? "cur" : ""}">${i + 1}. ${esc(s.title)}</span>`).join("")}</div>`;
  stages.forEach((s, i) => {
    h += `<details class="card ${i === current ? "current" : ""}" ${i === current ? "open" : ""}><summary>${i + 1}. ${esc(s.title)} ${s.confirmed ? `<span class="badge ok">onaylandı · ${fmtDate(s.confirmed.at)}</span>` : s.autoOk ? `<span class="badge ok">kontroller tamam</span>` : `<span class="badge warn">kontroller eksik</span>`}</summary><p class="small muted">${esc(s.summary)}</p>
    <ul class="small">${s.guidance.map(g => `<li>${esc(g)}</li>`).join("")}</ul>
    <table><thead><tr><th>Kontrol</th><th>Durum</th><th>Ayrıntı</th></tr></thead><tbody>${s.checks.map(c => `<tr><td>${esc(c[0])} ${c[3] ? "" : '<span class="badge mute">tavsiye</span>'}</td><td>${c[1] ? '<span class="ok">✓</span>' : '<span class="warn">△</span>'}</td><td class="small muted">${esc(c[2])}</td></tr>`).join("")}</tbody></table>
    <div class="row" style="margin-top:8px"><button class="btn s" data-go="${s.link}">Sayfaya git</button>${isAdmin() ? (s.confirmed ? `<button class="btn s" data-unconfirm="${s.key}">Onayı geri al</button>` : `<button class="btn s p" data-confirm="${s.key}" ${s.autoOk ? "" : 'title="Zorunlu kontroller eksik; yine de onaylanabilir"'}>Aşamayı onayla</button>`) : ""}</div>
    ${s.confirmed && s.confirmed.note ? `<p class="small muted" style="margin-top:6px">Not: ${esc(s.confirmed.note)}</p>` : ""}</details>`;
  });
  return h;
};
V.ozet.bind = () => {
  $("#main").querySelectorAll("[data-confirm]").forEach(b => b.onclick = () => confirmBox("Aşamayı onayla", "Bu aşamayı tamamlandı olarak işaretliyorsunuz. İsterseniz kısa bir not bırakın.", v => { S.stages[b.dataset.confirm] = { at: new Date().toISOString(), by: S.currentUser, note: v }; audit("STAGE_CONFIRM", b.dataset.confirm); save(); note("ok", "Aşama onaylandı."); }, { input: "Not (isteğe bağlı)", yes: "Onayla" }));
  $("#main").querySelectorAll("[data-unconfirm]").forEach(b => b.onclick = () => { delete S.stages[b.dataset.unconfirm]; audit("STAGE_UNCONFIRM", b.dataset.unconfirm); save(); note("ok", "Onay geri alındı."); });
};

// ---------- Kurulum
V.kurulum = () => {
  if (!isAdmin()) return `<h1>Kurulum</h1><div class="msg warn">Bu sayfa İK yöneticisi görünümünde düzenlenir. Sol alttan "İK yöneticisi" seçin.</div>`;
  const tree = pid => `<ul>${S.units.filter(u => (u.parentId || null) === pid).map(u => { const m = person(u.managerId); const n = S.people.filter(p => p.active && p.unitId === u.id).length; return `<li><b>${esc(u.name)}</b> <span class="badge mute">${UNIT_TYPES[u.type] || u.type}</span> <span class="small muted">yönetici: ${m ? esc(m.name) : '<span class="warn">atanmamış</span>'} · ${n} kişi</span> <button class="btn s" data-eu="${u.id}">Düzenle</button> <button class="btn s danger" data-du="${u.id}">Sil</button>${tree(u.id)}</li>`; }).join("")}</ul>`;
  const eu = param && param.unit ? unit(param.unit) : null;
  const er = param && param.role ? role(param.role) : null;
  const ep = param && param.person ? person(param.person) : null;
  let h = `<h1>Kurulum</h1><p class="lead">Birimleri (grup müdürlüğü, müdürlükler, servisler), rolleri ve kişileri burada ekler, düzenler, silersiniz. Yönetici zinciri birim yöneticisinden türer: bir kişinin yöneticisi, bağlı olduğu birimin (veya üst biriminin) yöneticisidir.</p>` + flashHtml();
  h += `<div class="card"><h2>Birimler</h2><div class="tree">${tree(null)}</div>
  <form id="fUnit" class="form" style="margin-top:10px"><input type="hidden" name="id" value="${eu ? eu.id : ""}"><label>Birim adı<input name="name" required value="${esc(eu ? eu.name : "")}"></label><label>Tür<select name="type">${Object.entries(UNIT_TYPES).map(([k, v]) => `<option value="${k}" ${eu && eu.type === k ? "selected" : ""}>${v}</option>`).join("")}</select></label><label>Üst birim<select name="parentId"><option value="">— (en üst)</option>${opt(S.units.filter(u => !eu || u.id !== eu.id), eu ? eu.parentId : (S.units[0] || {}).id)}</select></label><label>Yönetici<select name="managerId"><option value="">— atanmamış</option>${opt(S.people.filter(p => p.active), eu ? eu.managerId : null)}</select></label><div class="row"><button class="btn p">${eu ? "Kaydet" : "Birim ekle"}</button>${eu ? '<button type="button" class="btn" data-cancel>Vazgeç</button>' : ""}</div></form></div>`;
  h += `<div class="card"><h2>Roller</h2><div class="tbl"><table><thead><tr><th>Rol</th><th>Aile</th><th>Kademe</th><th>Yönetici rolü</th><th>Kişi</th><th>Profil satırı</th><th></th></tr></thead><tbody>${S.roles.slice().sort((a, b) => a.grade - b.grade).map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.family || "")}</td><td>${r.grade}</td><td>${r.isManager ? "Evet" : "—"}</td><td>${S.people.filter(p => p.active && p.roleId === r.id).length}</td><td>${S.profiles.filter(p => p.roleId === r.id).length}</td><td class="row"><button class="btn s" data-er="${r.id}">Düzenle</button><button class="btn s danger" data-dr="${r.id}">Sil</button></td></tr>`).join("") || '<tr><td colspan="7" class="muted">Rol yok.</td></tr>'}</tbody></table></div>
  <form id="fRole" class="form" style="margin-top:10px"><input type="hidden" name="id" value="${er ? er.id : ""}"><label>Rol adı<input name="name" required value="${esc(er ? er.name : "")}"></label><label>Rol ailesi<input name="family" value="${esc(er ? er.family : "")}" placeholder="İnsan Kaynakları"></label><label>Kademe (1 = en alt)<input name="grade" type="number" min="1" max="12" value="${er ? er.grade : 2}"></label><label><input type="checkbox" name="isManager" ${er && er.isManager ? "checked" : ""}> Yönetici rolü</label><div class="row"><button class="btn p">${er ? "Kaydet" : "Rol ekle"}</button>${er ? '<button type="button" class="btn" data-cancel>Vazgeç</button>' : ""}</div></form></div>`;
  h += `<div class="card"><h2>Kişiler</h2><div class="tbl"><table><thead><tr><th>Sicil</th><th>Ad Soyad</th><th>Birim</th><th>Rol</th><th>Yönetici</th><th>Durum</th><th></th></tr></thead><tbody>${S.people.slice().sort((a, b) => a.name.localeCompare(b.name, "tr")).map(p => { const m = person(managerOf(p.id)); return `<tr class="${p.active ? "" : "muted"}"><td class="mono">${esc(p.no)}</td><td>${esc(p.name)}</td><td class="small">${esc(unitPath(p.unitId))}</td><td>${esc((role(p.roleId) || {}).name || '<span class="warn">rol yok</span>')}</td><td class="small">${m ? esc(m.name) : "—"}</td><td>${p.active ? '<span class="badge ok">aktif</span>' : '<span class="badge mute">ayrıldı</span>'}</td><td class="row"><button class="btn s" data-ep="${p.id}">Düzenle</button><button class="btn s danger" data-dp="${p.id}">Sil</button></td></tr>`; }).join("") || '<tr><td colspan="7" class="muted">Kişi yok.</td></tr>'}</tbody></table></div>
  <form id="fPerson" class="form" style="margin-top:10px"><input type="hidden" name="id" value="${ep ? ep.id : ""}"><label>Sicil no<input name="no" required value="${esc(ep ? ep.no : "")}"></label><label>Ad Soyad<input name="name" required value="${esc(ep ? ep.name : "")}"></label><label>E-posta<input name="email" value="${esc(ep ? ep.email : "")}"></label><label>Birim<select name="unitId" required>${opt(S.units, ep ? ep.unitId : null, u => unitPath(u.id))}</select></label><label>Rol<select name="roleId" required>${opt(S.roles.slice().sort((a, b) => a.grade - b.grade), ep ? ep.roleId : null)}</select></label><label><input type="checkbox" name="active" ${!ep || ep.active ? "checked" : ""}> Aktif</label><div class="row"><button class="btn p">${ep ? "Kaydet" : "Kişi ekle"}</button>${ep ? '<button type="button" class="btn" data-cancel>Vazgeç</button>' : ""}</div></form>
  <details style="margin-top:10px"><summary>Toplu kişi ekle (CSV yapıştır)</summary><p class="small muted">Her satır: <code>sicil;ad soyad;birim adı;rol adı;e-posta</code>. Birim ve rol adları yukarıdakilerle birebir aynı olmalı. Aynı sicil varsa güncellenir.</p><textarea id="csvPeople" rows="5" class="json" placeholder="3004;Ali Veli;İşe Alım Müdürlüğü;İK Uzmanı;ali@banka.com"></textarea><div class="row" style="margin-top:6px"><button class="btn" id="csvGo">Aktar</button></div></details></div>`;
  return h;
};
V.kurulum.bind = () => {
  const m = $("#main"); if (!$("#fUnit")) return;
  const fd = f => Object.fromEntries(new FormData(f).entries());
  m.querySelectorAll("[data-cancel]").forEach(b => b.onclick = () => go("kurulum"));
  m.querySelectorAll("[data-eu]").forEach(b => b.onclick = () => go("kurulum", { unit: b.dataset.eu }));
  m.querySelectorAll("[data-er]").forEach(b => b.onclick = () => go("kurulum", { role: b.dataset.er }));
  m.querySelectorAll("[data-ep]").forEach(b => b.onclick = () => go("kurulum", { person: b.dataset.ep }));
  $("#fUnit").onsubmit = e => { e.preventDefault(); const d = fd(e.target); if (d.parentId && d.id) { let u = unit(d.parentId), g = 0; while (u && g++ < 30) { if (u.id === d.id) return note("bad", "Bir birim kendi altına taşınamaz."); u = unit(u.parentId); } }
    if (d.id) { Object.assign(unit(d.id), { name: d.name.trim(), type: d.type, parentId: d.parentId || null, managerId: d.managerId || null }); audit("UNIT_UPDATE", d.name); } else { S.units.push({ id: uid(), name: d.name.trim(), type: d.type, parentId: d.parentId || null, managerId: d.managerId || null }); audit("UNIT_CREATE", d.name); }
    save(); param = null; note("ok", "Birim kaydedildi."); };
  m.querySelectorAll("[data-du]").forEach(b => b.onclick = () => { const u = unit(b.dataset.du); const kids = S.units.filter(x => x.parentId === u.id).length, ppl = S.people.filter(p => p.unitId === u.id).length; if (kids || ppl) return note("bad", `"${u.name}" silinemez: ${kids} alt birim, ${ppl} kişi bağlı. Önce onları taşıyın.`); confirmBox("Birimi sil", `"${u.name}" silinecek.`, () => { S.units = S.units.filter(x => x.id !== u.id); audit("UNIT_DELETE", u.name); save(); note("ok", "Birim silindi."); }, { danger: true, yes: "Sil" }); });
  $("#fRole").onsubmit = e => { e.preventDefault(); const d = fd(e.target); const v = { name: d.name.trim(), family: (d.family || "").trim(), grade: Math.max(1, +d.grade || 1), isManager: !!d.isManager }; if (d.id) { Object.assign(role(d.id), v); audit("ROLE_UPDATE", v.name); } else { S.roles.push(Object.assign({ id: uid() }, v)); audit("ROLE_CREATE", v.name); } save(); param = null; note("ok", "Rol kaydedildi."); };
  m.querySelectorAll("[data-dr]").forEach(b => b.onclick = () => { const r = role(b.dataset.dr); const n = S.people.filter(p => p.roleId === r.id).length; if (n) return note("bad", `"${r.name}" silinemez: ${n} kişi bu rolde.`); confirmBox("Rolü sil", `"${r.name}" ve rol profili satırları silinecek.`, () => { S.roles = S.roles.filter(x => x.id !== r.id); S.profiles = S.profiles.filter(p => p.roleId !== r.id); audit("ROLE_DELETE", r.name); save(); note("ok", "Rol silindi."); }, { danger: true, yes: "Sil" }); });
  $("#fPerson").onsubmit = e => { e.preventDefault(); const d = fd(e.target); const dup = S.people.find(p => p.no === d.no.trim() && p.id !== d.id); if (dup) return note("bad", `Sicil ${d.no} zaten ${dup.name} adına kayıtlı.`); const v = { no: d.no.trim(), name: d.name.trim(), email: (d.email || "").trim(), unitId: d.unitId, roleId: d.roleId, active: !!d.active }; if (d.id) { Object.assign(person(d.id), v); audit("PERSON_UPDATE", v.name); } else { S.people.push(Object.assign({ id: uid() }, v)); audit("PERSON_CREATE", v.name); } save(); param = null; note("ok", "Kişi kaydedildi."); };
  m.querySelectorAll("[data-dp]").forEach(b => b.onclick = () => { const p = person(b.dataset.dp); const ev = S.evidence.filter(e => e.personId === p.id).length; confirmBox("Kişiyi sil", ev ? `"${p.name}" için ${ev} kanıt var. Silmek yerine "Aktif" işaretini kaldırmanız önerilir. Yine de kişi, kanıtları ve değerlendirmeleri silinsin mi?` : `"${p.name}" silinecek.`, () => { S.people = S.people.filter(x => x.id !== p.id); S.evidence = S.evidence.filter(e => e.personId !== p.id); S.units.forEach(u => { if (u.managerId === p.id) u.managerId = null; }); S.cycles.forEach(c => c.assessments = c.assessments.filter(a => a.personId !== p.id)); S.plans = S.plans.filter(x => x.personId !== p.id); if (S.currentUser === p.id) S.currentUser = "admin"; audit("PERSON_DELETE", p.name); save(); note("ok", "Kişi silindi."); }, { danger: true, yes: "Sil" }); });
  $("#csvGo").onclick = () => { const lines = $("#csvPeople").value.split(/\r?\n/).map(l => l.trim()).filter(Boolean); let ok = 0; const errs = []; lines.forEach((l, i) => { const [no, name, un, rn, email] = l.split(";").map(x => (x || "").trim()); const u = S.units.find(x => x.name.toLowerCase() === (un || "").toLowerCase()), r = S.roles.find(x => x.name.toLowerCase() === (rn || "").toLowerCase()); if (!no || !name) return errs.push(`Satır ${i + 1}: sicil ve ad zorunlu.`); if (!u) return errs.push(`Satır ${i + 1}: birim bulunamadı "${un}".`); if (!r) return errs.push(`Satır ${i + 1}: rol bulunamadı "${rn}".`); const ex = S.people.find(p => p.no === no); if (ex) Object.assign(ex, { name, unitId: u.id, roleId: r.id, email: email || ex.email, active: true }); else S.people.push({ id: uid(), no, name, email: email || "", unitId: u.id, roleId: r.id, active: true }); ok++; }); audit("PERSON_IMPORT", `${ok} satır`); save(); note(errs.length ? "warn" : "ok", `${ok} kişi aktarıldı.${errs.length ? " Hatalar: " + errs.join(" ") : ""}`); };
};
