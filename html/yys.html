<title>Yetkinlik Yönetim Sistemi</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sol sabit menü + çalışma alanı; yoğun tablo ve form odaklı araç, kart yalnız "nesne" olan blokta */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --fg:#17202a; --muted:#5b6774; --line:#d9e0e7;
  --brand:#0b3d62; --brand-2:#2a7fb8; --brand-soft:#e3eef7;
  --ok:#1f7a3a; --ok-soft:#e3f3e8; --warn:#9a6200; --warn-soft:#fff3d6; --bad:#b42318; --bad-soft:#fde8e6;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f161d;--surface:#172029;--fg:#e8edf2;--muted:#9aa8b6;--line:#2a3743;--brand:#9cc9ea;--brand-2:#5aa6dc;--brand-soft:#1b2f40;--ok:#6fcf8a;--ok-soft:#163421;--warn:#e8b84a;--warn-soft:#3b2d0c;--bad:#f28b82;--bad-soft:#3f1a17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f161d;--surface:#172029;--fg:#e8edf2;--muted:#9aa8b6;--line:#2a3743;--brand:#9cc9ea;--brand-2:#5aa6dc;--brand-soft:#1b2f40;--ok:#6fcf8a;--ok-soft:#163421;--warn:#e8b84a;--warn-soft:#3b2d0c;--bad:#f28b82;--bad-soft:#3f1a17;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;margin:0;min-height:100%}
#app{display:flex;min-height:100vh}
nav.side{width:232px;flex:0 0 232px;background:var(--brand);color:#fff;padding:16px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
:root[data-theme="dark"] nav.side, :root:not([data-theme="light"]) nav.side{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.side{background:#0b2a44}}
:root[data-theme="dark"] nav.side{background:#0b2a44}
nav.side .brand{font-weight:700;margin-bottom:10px;line-height:1.2}
nav.side .brand small{display:block;font-weight:400;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
nav.side a{color:#fff;text-decoration:none;padding:7px 10px;border-radius:6px;font-size:13.5px;display:block}
nav.side a:hover{background:rgba(255,255,255,.1)}
nav.side a.active{background:rgba(255,255,255,.18);font-weight:600}
nav.side .group{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.65;margin:10px 10px 2px}
nav.side .who{margin-top:auto;border-top:1px solid rgba(255,255,255,.25);padding-top:10px;font-size:12px}
nav.side select{width:100%;margin-top:4px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:6px}
nav.side select option{color:#17202a}
main{flex:1;min-width:0;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:none}
@media (max-width:860px){#app{flex-direction:column}nav.side{position:static;width:auto;height:auto;flex-direction:row;flex-wrap:wrap;gap:4px}nav.side .group{display:none}nav.side .who{margin-top:0;border:0;padding:0;width:100%}nav.side .brand{width:100%}}
h1{font-size:22px;margin:0 0 4px;color:var(--brand);text-wrap:balance}
h2{font-size:16px;margin:0 0 8px}
h3{font-size:14px;margin:0 0 6px}
p{margin:0 0 8px}
.lead{color:var(--muted);max-width:72ch;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card.current{border-color:var(--brand-2);box-shadow:0 0 0 2px var(--brand-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile .k{font-size:12px;color:var(--muted)}.tile .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;background:var(--brand-soft);color:var(--brand);padding:6px 8px;font-weight:600}
td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
tr.hl td{background:var(--warn-soft)}
.tbl{overflow-x:auto}
.btn{font:inherit;font-size:13px;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--brand-2)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.p{color:#0b2a44}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.p{color:#0b2a44}}
.btn.s{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--brand-2);outline-offset:1px}
input,select,textarea{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);width:100%}
input[type=checkbox]{width:auto}
label{font-size:12.5px;color:var(--muted);display:block}
label>input,label>select,label>textarea{margin-top:3px}
.form{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
.form .wide{grid-column:1/-1}
.badge{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:500;background:var(--brand-soft);color:var(--brand)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.mute{background:var(--line);color:var(--muted)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:var(--mono);font-size:12px}
.msg{padding:8px 10px;border-radius:6px;margin:8px 0;font-size:13px}.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.bad{background:var(--bad-soft);color:var(--bad)}.msg.warn{background:var(--warn-soft);color:var(--warn)}
.bar{height:8px;background:var(--line);border-radius:4px;width:96px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand-2)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.steps span{border-radius:999px;padding:3px 10px;font-size:12px;background:var(--line);color:var(--muted)}
.steps span.done{background:var(--ok-soft);color:var(--ok)}.steps span.cur{background:var(--brand);color:#fff}
details>summary{cursor:pointer;font-weight:600}
.tree ul{list-style:none;margin:0;padding-left:16px;border-left:1px solid var(--line)}.tree>ul{padding-left:0;border:0}
.tree li{margin:3px 0}
.heat td.c{text-align:center;font-variant-numeric:tabular-nums}
.c.g{background:var(--ok-soft)}.c.y{background:var(--warn-soft)}.c.r{background:var(--bad-soft)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:var(--surface);border-radius:8px;padding:16px;max-width:460px;width:100%}
.pick{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px;font-size:13px}
.pick label{display:flex;gap:6px;align-items:flex-start;color:var(--fg);margin:3px 0}
.pick .lv{font-family:var(--mono);font-size:11px;background:var(--line);border-radius:4px;padding:0 4px;white-space:nowrap}
textarea.json{font-family:var(--mono);font-size:11.5px;min-height:140px}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .15s}}
</style>
<div id="app">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>
<div id="modal"></div>
<style>
nav.side a.locked{opacity:.45;cursor:default;pointer-events:none}
nav.side a.locked small{float:right;font-size:10px;opacity:.9}
.etaps{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.etap{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.etap.done{border-color:var(--ok);background:var(--ok-soft)}.etap.cur{border-color:var(--brand-2);box-shadow:0 0 0 2px var(--brand-soft)}
.etap .n{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.check{list-style:none;padding:0;margin:6px 0}.check li{padding:4px 0;border-top:1px solid var(--line)}.check li:first-child{border:0}
</style>
<script>
/* =====================================================================
   Yetkinlik Yönetim Sistemi · v1 · Etap 0 (çekirdek)
   Kapsam: giriş ve hesaplar, role göre menü iskeleti, Özet, yedek ve veri.
   Kaynak belge: docs/14-v1-gereksinimler-ve-etaplar.md
   ===================================================================== */
const KEY = "yys_v1";
const ETAP = 0;
const ETAPS = [
  [0, "Çekirdek", "Giriş, hesaplar, menü iskeleti, Özet, yedek"],
  [1, "Kurulum", "Birimler, roller, kişiler, hesaplar, tür/alt tür, ayarlar"],
  [2, "Davranışsal yetkinlikler", "İK editörü, kalite kontrol, aktifleştirme"],
  [3, "Teknik beceriler", "Müdür tanımlar, İK onaylar"],
  [4, "Rol profilleri ve Yetkinliklerim", "Hedef/ağırlık, ek yetkinlik seçimi"],
  [5, "Kanıt", "Kanıt kasam, ekip kanıtları, seviye hesabı"],
  [6, "Değerlendirme", "Öz-beyan, yönetici görüşü, mutabakat, itiraz"],
  [7, "Gelişim planı", "Öncelik, eylem, onay"],
  [8, "Raporlar ve takip", "Isı haritası, ölçütler, süreç takibi, rehber"],
];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const today = () => new Date().toISOString().slice(0, 10);
const UNIT_TYPES = { DIREKTORLUK: "Grup Müdürlüğü / Direktörlük", DEPARTMAN: "Müdürlük", SERVIS: "Servis / Ekip" };

/* ---------- Durum ve kalıcılık ---------- */
let S = null;
function emptyState() {
  return { version: 1, etap: ETAP, createdAt: new Date().toISOString(), example: false,
    units: [], roles: [], people: [], users: [], competencies: [], profiles: [], requests: [], evidence: [], assessments: [], history: [], snapshots: [], plans: [], stages: {}, audit: [],
    taxonomy: null, settings: { requestsBy: "CALISANLAR" }, auth: { userId: null, viewAs: null } };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* depolama kapalı olabilir */ } }
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { S = Object.assign(emptyState(), JSON.parse(raw)); migrate(); return; } } catch (e) {}
  S = emptyState(); seedExample(); save();
}
function migrate() { if (!S.users.length) S.users.push(adminUser()); S.auth = S.auth || { userId: null, viewAs: null }; }
function audit(action, detail) { S.audit.unshift({ at: new Date().toISOString(), by: actorId(), action, detail: detail || "" }); if (S.audit.length > 2000) S.audit.length = 2000; }

/* ---------- Şifre ---------- */
function fallbackHash(pw) { let h = 5381; for (const ch of "yys|" + pw) h = (Math.imul(h, 33) ^ ch.charCodeAt(0)) >>> 0; return "x" + h.toString(16); }
async function hashPw(pw) { try { if (crypto && crypto.subtle) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("yys|" + pw)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); } } catch (e) {} return fallbackHash(pw); }
async function verifyPw(pw, hash) { return hash === fallbackHash(pw) || hash === (await hashPw(pw)); }
const adminUser = () => ({ id: uid(), username: "admin", passHash: fallbackHash("Admin123!"), personId: null, isAdmin: true, createdAt: new Date().toISOString(), lastLogin: null, mustChange: false });

/* ---------- Örnek veri: yalnız birim, rol, kişi, hesap ---------- */
function seedExample() {
  S.example = true;
  const grup = { id: uid(), parentId: null, type: "DIREKTORLUK", name: "İnsan Kaynakları Grup Müdürlüğü", managerId: null };
  const m1 = { id: uid(), parentId: grup.id, type: "DEPARTMAN", name: "İşe Alım Müdürlüğü", managerId: null };
  const m2 = { id: uid(), parentId: grup.id, type: "DEPARTMAN", name: "Yetenek ve Yetkinlik Yönetimi", managerId: null };
  S.units.push(grup, m1, m2);
  const rGM = { id: uid(), name: "Grup Müdürü", family: "İK Yönetimi", grade: 6, isManager: true };
  const rM = { id: uid(), name: "Müdür", family: "İK Yönetimi", grade: 5, isManager: true };
  const rU = { id: uid(), name: "İK Uzmanı", family: "İnsan Kaynakları", grade: 2, isManager: false };
  const rUY = { id: uid(), name: "İK Uzman Yardımcısı", family: "İnsan Kaynakları", grade: 1, isManager: false };
  S.roles.push(rGM, rM, rU, rUY);
  const p = (no, name, unitId, roleId) => ({ id: uid(), no, name, email: "", unitId, roleId, active: true });
  const gm = p("1001", "Ayşe Yılmaz (örnek)", grup.id, rGM.id), md1 = p("2001", "Can Aydın (örnek)", m1.id, rM.id), md2 = p("2002", "Elif Kaya (örnek)", m2.id, rM.id);
  const u1 = p("3001", "Zeynep Arslan (örnek)", m1.id, rU.id), u2 = p("3002", "Mehmet Demir (örnek)", m1.id, rUY.id), u3 = p("3003", "Selin Koç (örnek)", m2.id, rU.id);
  S.people.push(gm, md1, md2, u1, u2, u3);
  grup.managerId = gm.id; m1.managerId = md1.id; m2.managerId = md2.id;
  S.users.push(adminUser());
  for (const x of S.people) S.users.push({ id: uid(), username: x.no, passHash: fallbackHash(x.no), personId: x.id, isAdmin: false, createdAt: new Date().toISOString(), lastLogin: null, mustChange: true });
}

/* ---------- Yardımcılar ---------- */
const byId = (arr, id) => arr.find(x => x.id === id);
const unit = id => byId(S.units, id), role = id => byId(S.roles, id), person = id => byId(S.people, id);
function unitPath(id) { const parts = []; let u = unit(id), g = 0; while (u && g++ < 30) { parts.unshift(u.name); u = unit(u.parentId); } return parts.join(" › "); }
function managerOf(pid) { const p = person(pid); if (!p) return null; let u = unit(p.unitId), g = 0; while (u && g++ < 30) { if (u.managerId && u.managerId !== pid) return u.managerId; u = unit(u.parentId); } return null; }
function teamOf(mid) { return S.people.filter(p => p.active && p.id !== mid && managerOf(p.id) === mid).map(p => p.id); }
function currentLogin() { return byId(S.users, S.auth.userId) || null; }
function realAdmin() { const u = currentLogin(); return !!(u && u.isAdmin); }
/** Etkin kişi: admin kendi görünümünde ise null (İK), bir kişi olarak bakıyorsa o kişi; çalışan hesabı ise kendisi. */
function me() { const u = currentLogin(); if (!u) return null; if (u.isAdmin) return S.auth.viewAs ? person(S.auth.viewAs) || null : null; return person(u.personId) || null; }
function isAdmin() { return realAdmin() && !S.auth.viewAs; }
function actorId() { const m = me(); return m ? m.id : "admin"; }
function isUpper() { if (isAdmin()) return true; const m = me(); return !!m && S.units.some(u => !u.parentId && u.managerId === m.id); }
function isManagerUser() { const m = me(); return isAdmin() || (!!m && teamOf(m.id).length > 0) || isUpper(); }
function roleName() { if (isAdmin()) return "İK yöneticisi"; const m = me(); if (!m) return "—"; return isUpper() ? "Grup müdürü" : teamOf(m.id).length ? "Müdür" : "Çalışan"; }
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const fmtDate = d => d ? new Date(d).toLocaleDateString("tr-TR") : "—";

/* ---------- Arayüz altyapısı ---------- */
const $ = sel => document.querySelector(sel);
let route = "ozet", param = null, flash = null;
function go(r, p, keep) { const y = window.scrollY; route = r; param = p == null ? null : p; render(); window.scrollTo(0, keep ? y : 0); }
function note(kind, text) { flash = { kind, text }; render(); }
const flashHtml = () => { if (!flash) return ""; const f = flash; flash = null; return `<div class="msg ${f.kind}">${esc(f.text)}</div>`; };
function confirmBox(title, text, onYes, opts) {
  opts = opts || {};
  $("#modal").innerHTML = `<div class="modal" id="mdl"><div class="box" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p class="small">${esc(text)}</p>${opts.input ? `<label>${esc(opts.input)}<textarea id="mdl-in" rows="3"></textarea></label>` : ""}<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="mdl-no">Vazgeç</button><button class="btn p ${opts.danger ? "danger" : ""}" id="mdl-yes">${esc(opts.yes || "Evet")}</button></div></div></div>`;
  $("#mdl-no").onclick = () => { $("#modal").innerHTML = ""; };
  $("#mdl-yes").onclick = () => { const v = opts.input ? $("#mdl-in").value.trim() : null; if (opts.input && opts.required && v.length < (opts.min || 1)) { $("#mdl-in").focus(); return; } $("#modal").innerHTML = ""; onYes(v); };
  setTimeout(() => ($("#mdl-in") || $("#mdl-yes")).focus(), 0);
}
function infoBox(title, html, onOk) {
  $("#modal").innerHTML = `<div class="modal" id="mdl"><div class="box" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><div class="small">${html}</div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn p" id="mdl-yes">Tamam</button></div></div></div>`;
  $("#mdl-yes").onclick = () => { $("#modal").innerHTML = ""; if (onOk) onOk(); }; setTimeout(() => $("#mdl-yes").focus(), 0);
}
function guide(title, steps) { return `<details class="card" style="border-left:4px solid var(--brand-2)"><summary>📘 ${esc(title)}</summary><ol class="small" style="margin:8px 0 4px 18px;padding:0">${steps.map(x => `<li>${x}</li>`).join("")}</ol></details>`; }

/* ---------- Menü iskeleti (role göre; etabı gelmeyenler kilitli görünür) ---------- */
// [rota, başlık, etap, kimler görür] — kimler: IK, MGR (müdür/GM), GM (yalnız grup müdürü), EMP (çalışan), ALL
const NAV = [
  ["Genel", [["ozet", "Özet", 0, "ALL"], ["ogren", "Öğrenme rehberi (A'dan Z'ye)", 8, "ALL"]]],
  ["İK tanımları", [["kurulum", "Kurulum (birim, rol, kişi, tür, kullanıcı)", 1, "IK"], ["davranissal", "Davranışsal yetkinlikler", 2, "IK,MGR"], ["teknikk", "Teknik beceriler", 3, "IK,MGR"], ["profiller", "Rol profilleri", 4, "IK,MGR"]]],
  ["Benim sürecim", [["yetkinliklerim", "Yetkinliklerim", 4, "EMP"], ["kanit", "Kanıt kasam", 5, "MGR,EMP"], ["degerlendirme", "Değerlendirmem", 6, "MGR,EMP"], ["gelisim", "Gelişim planı", 7, "ALL"]]],
  ["Ekibim", [["teknik", "Teknik beceri tanımlama", 3, "MGR"], ["ekipkanit", "Ekibimin kanıtları", 5, "IK,MGR"], ["talepler", "Yetkinlik talepleri", 4, "IK,MGR"], ["ekipdeg", "Ekibimin değerlendirmeleri", 6, "IK,MGR"], ["ust", "Üst doğrulama / itiraz", 6, "IK,GM"]]],
  ["Yönetim", [["raporlar", "Raporlar", 8, "IK,MGR"], ["takip", "Süreç takibi (kim ne yaptı)", 8, "IK"], ["yedek", "Yedek ve veri", 0, "ALL"]]],
];
function visibleTo(who) { const set = who.split(","); if (set.includes("ALL")) return true; if (isAdmin()) return set.includes("IK"); const m = me(); if (!m) return false; const mgr = teamOf(m.id).length > 0 || isUpper(); if (set.includes("GM") && isUpper()) return true; if (set.includes("MGR") && mgr) return true; if (set.includes("EMP") && !mgr) return true; return false; }
function renderNav() {
  const u = currentLogin(); const m = me();
  const label = r => r === "davranissal" && !isAdmin() ? "Davranışsal yetkinlikler (tanımlılar)" : r === "teknikk" && !isAdmin() ? "Teknik beceriler (tanımlılar)" : r === "gelisim" && isManagerUser() ? "Gelişim planları" : null;
  const items = NAV.map(([g, list]) => { const vis = list.filter(x => visibleTo(x[3])); if (!vis.length) return ""; const gl = g === "Ekibim" && isAdmin() ? "Tüm ekipler" : g === "İK tanımları" && !isAdmin() ? "Tanımlar (salt okunur)" : g; return `<div class="group">${gl}</div>` + vis.map(([r, l, e]) => e <= ETAP ? `<a href="#${r}" class="${route === r ? "active" : ""}" data-r="${r}">${label(r) || l}</a>` : `<a class="locked" title="Etap ${e}'de gelecek">${label(r) || l}<small>Etap ${e}</small></a>`).join(""); }).join("");
  $("#nav").innerHTML = `<div class="brand">Yetkinlik Yönetim Sistemi<small>v1 · Etap ${ETAP} · İK Grup Müdürlüğü</small></div>` + items +
    `<div class="who"><div><b>${esc(u ? u.username : "")}</b> <span style="opacity:.75">· ${esc(roleName())}${m ? ` · ${esc(m.name)}` : ""}</span></div>` +
    (realAdmin() ? `<label style="color:#fff;opacity:.9;margin-top:6px">İK görünümü: şu kişi olarak bak<select id="viewAs"><option value="">— İK yöneticisi (kendim)</option>${S.people.filter(p => p.active).map(p => `<option value="${p.id}" ${S.auth.viewAs === p.id ? "selected" : ""}>${esc(p.name)} · ${esc((role(p.roleId) || {}).name || "")}</option>`).join("")}</select></label>` : "") +
    `<div class="row" style="margin-top:8px"><button class="btn s" id="btnPw">Şifre değiştir</button><button class="btn s" id="btnOut">Çıkış</button></div></div>`;
  $("#nav").querySelectorAll("a[data-r]").forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.r); });
  const va = $("#viewAs"); if (va) va.onchange = e => { S.auth.viewAs = e.target.value || null; save(); go("ozet"); };
  $("#btnOut").onclick = () => { audit("LOGOUT", u ? u.username : ""); S.auth = { userId: null, viewAs: null }; save(); go("ozet"); };
  $("#btnPw").onclick = () => go("sifre");
}

/* ---------- Ekranlar ---------- */
const V = {};
V.giris = () => `<div style="max-width:440px;margin:40px auto"><h1>Yetkinlik Yönetim Sistemi</h1><p class="lead">v1 · Etap ${ETAP} · İK Grup Müdürlüğü. Kullanıcı adınız ve şifrenizle girin.</p>${flashHtml()}<form id="fLogin" class="card"><label>Kullanıcı adı<input name="u" autocomplete="username" required autofocus></label><label style="margin-top:8px">Şifre<input name="p" type="password" autocomplete="current-password" required></label><div class="row" style="margin-top:12px"><button class="btn p">Giriş</button></div><p class="small muted" style="margin-top:10px">Deneme hesapları: <span class="mono">admin / Admin123!</span> (İK yöneticisi). Örnek kişiler: kullanıcı adı = şifre = sicil no (<span class="mono">1001</span> grup müdürü, <span class="mono">2001</span> müdür, <span class="mono">3001</span> uzman). İlk girişte şifre değiştirilir.</p><p class="small muted">Veriler yalnız bu tarayıcıda saklanır; yedek için "Yedek ve veri" sayfası.</p></form></div>`;
V.giris.bind = () => { $("#fLogin").onsubmit = async e => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target).entries()); const u = S.users.find(x => x.username.toLowerCase() === d.u.trim().toLowerCase()); if (!u || !(await verifyPw(d.p, u.passHash))) return note("bad", "Kullanıcı adı veya şifre hatalı."); if (u.personId && !(person(u.personId) || {}).active) return note("bad", "Bu kullanıcının kişisi aktif değil."); S.auth = { userId: u.id, viewAs: null }; u.lastLogin = new Date().toISOString(); audit("LOGIN", u.username); save(); if (u.mustChange) { flash = { kind: "warn", text: "İlk girişte şifrenizi değiştirin." }; go("sifre"); } else go("ozet"); }; };
V.sifre = () => `<h1>Şifre değiştir</h1>${flashHtml()}<form id="fPw" class="card" style="max-width:420px"><label>Yeni şifre (en az 6 karakter)<input name="p1" type="password" required minlength="6" autofocus></label><label style="margin-top:8px">Yeni şifre (tekrar)<input name="p2" type="password" required></label><div class="row" style="margin-top:12px"><button class="btn p">Kaydet</button><button type="button" class="btn" data-go="ozet">Vazgeç</button></div></form>`;
V.sifre.bind = () => { $("#fPw").onsubmit = async e => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target).entries()); if (d.p1 !== d.p2) return note("bad", "Şifreler aynı değil."); const u = currentLogin(); u.passHash = await hashPw(d.p1); u.mustChange = false; audit("PASSWORD_CHANGE", u.username); save(); flash = { kind: "ok", text: "Şifre değiştirildi." }; go("ozet"); }; };

V.ozet = () => {
  const m = me(); const rn = roleName();
  let h = `<h1>Özet${m ? " · " + esc(m.name) : ""}</h1><p class="lead">${isAdmin() ? "İK yöneticisi görünümü: tüm süreci görür, kurar ve istediği kişi olarak bakar." : rn === "Çalışan" ? "Çalışan görünümü: rol profili, kanıt, öz-beyan, mutabakat ve gelişim planı sırasıyla gelecek." : "Yönetici görünümü: kendi değerlendirmeniz ve ekibinizin süreci ayrı ayrı gelecek."} Uygulama etap etap kuruluyor; kilitli menü maddeleri hangi etapta geleceğini gösterir.</p>` + flashHtml();
  if (S.example) h += `<div class="msg warn">Örnek veri yüklü (adların yanında "(örnek)"). Gerçek kuruluma başlarken Yedek ve veri sayfasından örnek veriyi temizleyin.</div>`;
  h += `<div class="card current"><div class="row"><div style="flex:1"><div class="small muted">Sıradaki adımınız</div><h2 style="margin:2px 0">${isAdmin() ? "Etap 0'ı deneyin, sonra Etap 1'e (Kurulum) geçilecek" : "Giriş yapıp şifrenizi değiştirdiniz; sonraki etaplarda sayfalarınız açılacak"}</h2><p class="small">${isAdmin() ? "Aşağıdaki kontrol listesini deneyin: başka kişi olarak bakma, yedek alma ve geri yükleme, örnek veriyi temizleme." : "Şimdilik yapılacak bir iş yok. Etap 5'te kanıt kasanız, Etap 6'da değerlendirmeniz açılır."}</p></div>${isAdmin() ? '<button class="btn p" data-go="yedek">Yedek ve veri</button>' : ""}</div></div>`;
  h += `<div class="card"><h2>Etap durumu</h2><div class="etaps">${ETAPS.map(([n, t, d]) => `<div class="etap ${n < ETAP ? "done" : n === ETAP ? "cur" : ""}"><div class="n">Etap ${n} ${n < ETAP ? "· tamam" : n === ETAP ? "· şimdi" : ""}</div><b>${esc(t)}</b><div class="small muted">${esc(d)}</div></div>`).join("")}</div></div>`;
  const checks = isAdmin() ? ["admin / Admin123! ile giriş yaptım.", "Sol alttan bir kişi olarak baktım; menü değişti (çalışan, müdür, grup müdürü farklı).", "Bir örnek hesapla (örn. 3001 / 3001) girdim; ilk girişte şifre değiştirmem istendi.", "Yedek ve veri: JSON'u gösterdim/kopyaladım/indirdim.", "JSON'u 'İçe aktar' ile geri yükledim; kişiler geri geldi.", "'Örnek veriyi temizle' ile boş sisteme geçtim (admin hesabı kaldı).", "'Her şeyi sıfırla' ile örnek veriye geri döndüm.", "Sayfayı yeniledim; oturum ve veri kaldı."] : ["Kullanıcı adım ve ilk şifremle (sicil no) girdim.", "Şifremi değiştirdim.", "Menüde yalnız bana ait maddeler var; kilitliler etabını gösteriyor.", "Çıkış yapıp yeniden girdim."];
  h += `<div class="card"><h2>Bu etapta deneyebilecekleriniz (${esc(rn)})</h2><ul class="check">${checks.map(c => `<li>☐ ${esc(c)}</li>`).join("")}</ul><p class="small muted">Sorun gördüğünüzde not alın; bir sonraki etaba geçmeden düzeltilir.</p></div>`;
  if (isAdmin()) h += `<div class="card"><h2>Örnek veri</h2><div class="tbl"><table><thead><tr><th>Sicil</th><th>Ad</th><th>Birim</th><th>Rol</th><th>Yönetici</th><th>Hesap</th></tr></thead><tbody>${S.people.map(p => `<tr><td class="mono">${esc(p.no)}</td><td>${esc(p.name)}</td><td class="small">${esc(unitPath(p.unitId))}</td><td>${esc((role(p.roleId) || {}).name || "")}</td><td class="small">${esc((person(managerOf(p.id)) || {}).name || "—")}</td><td class="mono">${esc((S.users.find(u => u.personId === p.id) || {}).username || "—")}</td></tr>`).join("") || '<tr><td colspan="6" class="muted">Kişi yok (Etap 1 Kurulum ile eklenecek).</td></tr>'}</tbody></table></div></div>`;
  return h;
};

/* ---------- Yedek ve veri ---------- */
function exportJson() { return JSON.stringify(Object.assign({}, S, { auth: { userId: null, viewAs: null } }), null, 1); }
function mergeState(inc) {
  const n = {}; const push = (key) => { (inc[key] || []).forEach(item => { const arr = S[key]; const i = arr.findIndex(x => x.id === item.id); if (i >= 0) arr[i] = item; else { arr.push(item); n[key] = (n[key] || 0) + 1; } }); };
  ["units", "roles", "people", "competencies", "evidence", "requests", "history", "snapshots"].forEach(push);
  (inc.users || []).forEach(u => { if (!S.users.some(x => x.username === u.username)) { S.users.push(u); n.users = (n.users || 0) + 1; } });
  (inc.profiles || []).forEach(p => { if (!S.profiles.some(x => x.roleId === p.roleId && x.competencyId === p.competencyId)) { S.profiles.push(p); n.profiles = (n.profiles || 0) + 1; } });
  (inc.assessments || []).forEach(a => { const i = S.assessments.findIndex(x => x.personId === a.personId); if (i >= 0) S.assessments[i] = a; else { S.assessments.push(a); n.assessments = (n.assessments || 0) + 1; } });
  (inc.plans || []).forEach(p => { const i = S.plans.findIndex(x => x.personId === p.personId); if (i >= 0) S.plans[i] = p; else { S.plans.push(p); n.plans = (n.plans || 0) + 1; } });
  Object.assign(S.stages, inc.stages || {}); if (inc.taxonomy) S.taxonomy = S.taxonomy || inc.taxonomy;
  return n;
}
V.yedek = () => {
  const size = Math.round(exportJson().length / 1024);
  let h = `<h1>Yedek ve veri</h1><p class="lead">Veriler yalnız bu tarayıcıda saklanır. Düzenli yedek alın: JSON'u kopyalayıp bir dosyaya kaydedin ya da indirin. Başka bilgisayarda "İçe aktar" ile açılır; birden fazla kişinin dosyası "Birleştir" ile tek dosyada toplanır.</p>` + flashHtml();
  h += guide("Yedek ve çok kullanıcılı çalışma nasıl olur?", ["<b>Tek bilgisayar, sırayla giriş:</b> en basit yol; herkes aynı bilgisayarda kendi hesabıyla girer.", "<b>Herkes kendi bilgisayarında:</b> İK ana dosyayı dışa aktarır ve gönderir; herkes içe aktarıp çalışır, dışa aktarıp İK'ya yollar; İK \"Birleştir\" ile toplar. Kayıtlar kimlik numarasıyla eşleştiği için çakışmaz.", "<b>Haftada bir yedek</b> alın; dosya adına tarih yazın (yys-yedek-2026-10-25.json).", "<b>Örnek veriyi temizle:</b> gerçek kuruluma geçerken örnek kişileri siler; admin hesabı kalır.", "<b>Her şeyi sıfırla:</b> tüm veriyi siler, örnek veriyi yeniden yükler."]);
  h += `<div class="card"><h2>Dışa aktar (${size} KB)</h2><div class="row"><button class="btn p" id="exShow">JSON'u göster</button><button class="btn" id="exCopy">Panoya kopyala</button><button class="btn" id="exDl">Dosya olarak indir</button></div><p class="small muted">"İndir" bir kayıt onayı gösterir; çalışmazsa "Panoya kopyala" ile alıp bir metin dosyasına yapıştırın ve .json olarak kaydedin.</p><textarea id="exArea" class="json" style="width:100%;margin-top:8px" hidden readonly></textarea></div>`;
  h += `<div class="card"><h2>İçe aktar / birleştir</h2><p class="small muted"><b>İçe aktar</b> bu tarayıcıdaki veriyi dosyadakiyle <u>değiştirir</u>. <b>Birleştir</b> dosyadaki kayıtları mevcut veriye <u>ekler</u> (aynı kimlikli kayıt güncellenir).</p><div class="form"><label class="wide">JSON dosyası seç<input type="file" id="imFile" accept="application/json,.json"></label><label class="wide">veya JSON'u yapıştır<textarea id="imArea" class="json" style="width:100%"></textarea></label></div><div class="row" style="margin-top:8px"><button class="btn danger" id="imReplace">İçe aktar (değiştir)</button><button class="btn p" id="imMerge">Birleştir (ekle)</button></div></div>`;
  h += `<div class="card"><h2>Temizlik</h2><div class="row"><button class="btn" id="clearEx" ${S.example ? "" : "disabled"}>Örnek veriyi temizle</button><button class="btn danger" id="resetAll">Her şeyi sıfırla</button></div></div>`;
  h += `<div class="card"><h2>Son işlemler (denetim izi)</h2><div class="tbl"><table><thead><tr><th>Zaman</th><th>Kim</th><th>İşlem</th><th>Ayrıntı</th></tr></thead><tbody>${S.audit.slice(0, 20).map(a => `<tr><td class="small">${new Date(a.at).toLocaleString("tr-TR")}</td><td class="small">${esc(a.by === "admin" ? "İK" : (person(a.by) || {}).name || a.by)}</td><td class="mono">${esc(a.action)}</td><td class="small muted">${esc(String(a.detail).slice(0, 80))}</td></tr>`).join("") || '<tr><td colspan="4" class="muted">—</td></tr>'}</tbody></table></div></div>`;
  return h;
};
V.yedek.bind = () => {
  const area = $("#exArea");
  $("#exShow").onclick = () => { area.value = exportJson(); area.hidden = false; area.focus(); area.select(); };
  $("#exCopy").onclick = async () => { const t = exportJson(); try { await navigator.clipboard.writeText(t); note("ok", "JSON panoya kopyalandı; bir metin dosyasına yapıştırıp .json olarak kaydedin."); } catch (e) { area.value = t; area.hidden = false; area.focus(); area.select(); note("warn", "Otomatik kopyalama yapılamadı; metin seçildi, Ctrl/Cmd+C ile kopyalayın."); } };
  $("#exDl").onclick = async () => { const name = `yys-yedek-${today()}.json`; try { const dl = (window.claude && claude.use) ? await claude.use("downloads") : null; if (dl) { try { await dl.save({ filename: name, data: exportJson() }); audit("EXPORT", ""); note("ok", "Yedek dosyası kaydedildi."); } catch (e) { note(e && e.code === "declined" ? "warn" : "bad", e && e.code === "declined" ? "Kaydetme iptal edildi." : "Dosya kaydedilemedi; \"Panoya kopyala\" kullanın."); } return; } const blob = new Blob([exportJson()], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); audit("EXPORT", ""); note("ok", "İndirme başlatıldı. Başlamadıysa \"Panoya kopyala\" kullanın."); } catch (e) { note("bad", "İndirme yapılamadı; panoya kopyalayın."); } };
  const readInput = cb => { const f = $("#imFile").files[0]; if (f) { const r = new FileReader(); r.onload = () => cb(r.result); r.readAsText(f); } else cb($("#imArea").value); };
  const parse = t => { let o; try { o = JSON.parse(t); } catch (e) { note("bad", "Geçerli JSON değil."); return null; } if (!o || !Array.isArray(o.units) || !Array.isArray(o.people)) { note("bad", "Bu bir YYS yedeği değil (units/people yok)."); return null; } return o; };
  $("#imReplace").onclick = () => readInput(t => { const o = parse(t); if (!o) return; confirmBox("Veriyi değiştir", `Mevcut veri silinip dosyadaki yüklenecek: ${o.people.length} kişi, ${(o.competencies || []).length} yetkinlik, ${(o.evidence || []).length} kanıt. Önce yedek aldınız mı?`, () => { const keep = S.auth; S = Object.assign(emptyState(), o, { auth: { userId: null, viewAs: null } }); migrate(); const stillThere = byId(S.users, keep.userId); S.auth = stillThere ? keep : { userId: null, viewAs: null }; audit("IMPORT_REPLACE", `${S.people.length} kişi`); save(); flash = { kind: "ok", text: "Veri yüklendi." + (stillThere ? "" : " Lütfen yeniden giriş yapın.") }; go("ozet"); }, { danger: true, yes: "Değiştir" }); });
  $("#imMerge").onclick = () => readInput(t => { const o = parse(t); if (!o) return; const n = mergeState(o); audit("IMPORT_MERGE", JSON.stringify(n)); save(); note("ok", `Birleştirildi: ${Object.entries(n).map(([k, v]) => `${v} ${k}`).join(", ") || "yeni kayıt yok"} (var olanlar güncellendi).`); });
  $("#clearEx").onclick = () => confirmBox("Örnek veriyi temizle", "Örnek kişiler, birimler, roller ve hesapları silinir; admin hesabınız ve oturumunuz kalır. Boş sistemle gerçek kuruluma başlarsınız.", () => { const admins = S.users.filter(u => u.isAdmin); const keep = S.auth; S = emptyState(); S.users = admins; S.auth = { userId: keep.userId, viewAs: null }; S.example = false; audit("CLEAR_EXAMPLE", ""); save(); flash = { kind: "ok", text: "Örnek veri temizlendi. Etap 1'de Kurulum ile gerçek birim ve kişileri gireceksiniz." }; go("ozet"); }, { danger: true, yes: "Temizle" });
  $("#resetAll").onclick = () => confirmBox("Her şeyi sıfırla", "Bu tarayıcıdaki tüm YYS verisi silinir ve örnek veri yeniden yüklenir. Geri alınamaz.", () => { try { localStorage.removeItem(KEY); } catch (e) {} S = emptyState(); seedExample(); save(); flash = { kind: "ok", text: "Sıfırlandı. admin / Admin123! ile girin." }; go("ozet"); }, { danger: true, yes: "Sıfırla" });
};

/* ---------- Çizim ve açılış ---------- */
function render() {
  const u = currentLogin();
  if (!u) { $("#nav").hidden = true; $("#main").innerHTML = V.giris(); V.giris.bind(); return; }
  $("#nav").hidden = false; renderNav();
  const v = V[route] || V.ozet; let html;
  try { html = v(); } catch (e) { html = `<h1>Hata</h1><div class="msg bad">Sayfa çizilemedi: ${esc(e.message)}</div><button class="btn" data-go="ozet">Özete dön</button>`; console.error(e); }
  $("#main").innerHTML = html;
  try { if (v.bind) v.bind(); } catch (e) { console.error(e); }
  $("#main").querySelectorAll("[data-go]").forEach(b => b.onclick = e => { e.preventDefault(); go(b.dataset.go); });
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#mdl")) $("#modal").innerHTML = ""; });
load();
const h0 = (location.hash || "").replace("#", ""); if (V[h0]) route = h0;
render();
</script>
