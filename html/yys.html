<title>Yetkinlik Yönetim Sistemi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sol sabit menü + çalışma alanı; yoğun tablo ve form odaklı araç, kart yalnız "nesne" olan blokta */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --fg:#17202a; --muted:#5b6774; --line:#d9e0e7;
  --brand:#0b3d62; --brand-2:#2a7fb8; --brand-soft:#e3eef7;
  --ok:#1f7a3a; --ok-soft:#e3f3e8; --warn:#9a6200; --warn-soft:#fff3d6; --bad:#b42318; --bad-soft:#fde8e6;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f161d;--surface:#172029;--fg:#e8edf2;--muted:#9aa8b6;--line:#2a3743;--brand:#9cc9ea;--brand-2:#5aa6dc;--brand-soft:#1b2f40;--ok:#6fcf8a;--ok-soft:#163421;--warn:#e8b84a;--warn-soft:#3b2d0c;--bad:#f28b82;--bad-soft:#3f1a17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f161d;--surface:#172029;--fg:#e8edf2;--muted:#9aa8b6;--line:#2a3743;--brand:#9cc9ea;--brand-2:#5aa6dc;--brand-soft:#1b2f40;--ok:#6fcf8a;--ok-soft:#163421;--warn:#e8b84a;--warn-soft:#3b2d0c;--bad:#f28b82;--bad-soft:#3f1a17;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;margin:0;min-height:100%}
#app{display:flex;min-height:100vh}
nav.side{width:232px;flex:0 0 232px;background:var(--brand);color:#fff;padding:16px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
:root[data-theme="dark"] nav.side, :root:not([data-theme="light"]) nav.side{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.side{background:#0b2a44}}
:root[data-theme="dark"] nav.side{background:#0b2a44}
nav.side .brand{font-weight:700;margin-bottom:10px;line-height:1.2}
nav.side .brand small{display:block;font-weight:400;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
nav.side a{color:#fff;text-decoration:none;padding:7px 10px;border-radius:6px;font-size:13.5px;display:block}
nav.side a:hover{background:rgba(255,255,255,.1)}
nav.side a.active{background:rgba(255,255,255,.18);font-weight:600}
nav.side .group{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.65;margin:10px 10px 2px}
nav.side .who{margin-top:auto;border-top:1px solid rgba(255,255,255,.25);padding-top:10px;font-size:12px}
nav.side select{width:100%;margin-top:4px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:6px}
nav.side select option{color:#17202a}
main{flex:1;min-width:0;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:none}
@media (max-width:860px){#app{flex-direction:column}nav.side{position:static;width:auto;height:auto;flex-direction:row;flex-wrap:wrap;gap:4px}nav.side .group{display:none}nav.side .who{margin-top:0;border:0;padding:0;width:100%}nav.side .brand{width:100%}}
h1{font-size:22px;margin:0 0 4px;color:var(--brand);text-wrap:balance}
h2{font-size:16px;margin:0 0 8px}
h3{font-size:14px;margin:0 0 6px}
p{margin:0 0 8px}
.lead{color:var(--muted);max-width:72ch;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card.current{border-color:var(--brand-2);box-shadow:0 0 0 2px var(--brand-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile .k{font-size:12px;color:var(--muted)}.tile .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;background:var(--brand-soft);color:var(--brand);padding:6px 8px;font-weight:600}
td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
tr.hl td{background:var(--warn-soft)}
.tbl{overflow-x:auto}
.btn{font:inherit;font-size:13px;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--brand-2)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.p{color:#0b2a44}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.p{color:#0b2a44}}
.btn.s{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--brand-2);outline-offset:1px}
input,select,textarea{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);width:100%}
input[type=checkbox]{width:auto}
label{font-size:12.5px;color:var(--muted);display:block}
label>input,label>select,label>textarea{margin-top:3px}
.form{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
.form .wide{grid-column:1/-1}
.badge{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:500;background:var(--brand-soft);color:var(--brand)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.mute{background:var(--line);color:var(--muted)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:var(--mono);font-size:12px}
.msg{padding:8px 10px;border-radius:6px;margin:8px 0;font-size:13px}.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.bad{background:var(--bad-soft);color:var(--bad)}.msg.warn{background:var(--warn-soft);color:var(--warn)}
.bar{height:8px;background:var(--line);border-radius:4px;width:96px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand-2)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.steps span{border-radius:999px;padding:3px 10px;font-size:12px;background:var(--line);color:var(--muted)}
.steps span.done{background:var(--ok-soft);color:var(--ok)}.steps span.cur{background:var(--brand);color:#fff}
details>summary{cursor:pointer;font-weight:600}
.tree ul{list-style:none;margin:0;padding-left:16px;border-left:1px solid var(--line)}.tree>ul{padding-left:0;border:0}
.tree li{margin:3px 0}
.heat td.c{text-align:center;font-variant-numeric:tabular-nums}
.c.g{background:var(--ok-soft)}.c.y{background:var(--warn-soft)}.c.r{background:var(--bad-soft)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:var(--surface);border-radius:8px;padding:16px;max-width:460px;width:100%}
.pick{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px;font-size:13px}
.pick label{display:flex;gap:6px;align-items:flex-start;color:var(--fg);margin:3px 0}
.pick .lv{font-family:var(--mono);font-size:11px;background:var(--line);border-radius:4px;padding:0 4px;white-space:nowrap}
textarea.json{font-family:var(--mono);font-size:11.5px;min-height:140px}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .15s}}
</style>
<div id="app">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>
<div id="modal"></div>
<script>
// ===================== Veri ve kalıcılık =====================
const KEY = "yys_v0";
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const today = () => new Date().toISOString().slice(0, 10);
const LEVELS = {
  TEKNIK: ["Yok / Uygulanamaz", "Başlangıç", "Uygulayıcı", "Yetkin Uygulayıcı", "Yöneten", "Yön Veren"],
  DAVRANISSAL: ["Yok / Uygulanamaz", "Gelişmekte", "Uygular", "Güçlü", "Rol model", "Kültür taşıyıcı"],
};
const LEVEL_DEF = ["—", "Temel kavramları bilir, yakın gözetimle basit görevleri yapar", "Standart görevleri bağımsız yapar; rutin dışı durumda destek ister", "Karmaşık/rutin dışı görevleri bağımsız çözer; başkalarına rehberlik eder", "Alanın standardını belirler; başkalarını geliştirir; süreci iyileştirir", "Kurum çapında yön verir; yeni yaklaşımlar geliştirir; dış referans uzmanıdır"];
const EVTYPES = [["IS_CIKTISI", "İş çıktısı (rapor, tasarım, doküman)"], ["PROJE_GOREV", "Proje / görev kaydı"], ["GOZLEM_NOTU", "Yönetici gözlem notu"], ["SERTIFIKA_SINAV", "Sertifika / sınav"], ["PAYDAS_GERI_BILDIRIM", "Paydaş geri bildirimi"], ["OLCULEBILIR_SONUC", "Ölçülebilir sonuç"], ["MENTORLUK_KAYDI", "Mentorluk / eğitim verme kaydı"]];
const EV_STATUS = { TASLAK: "Taslak", SUNULDU: "Sunuldu", KABUL: "Kabul", EK_BILGI: "Ek bilgi istendi", RED: "Red" };
const A_LABEL = { ACILDI: "Açık (öz-beyan bekleniyor)", OZ_BEYAN_TAMAM: "Öz-beyan tamam", YONETICI_TAMAM: "Doğrulama tamam", UST_DOGRULAMADA: "Üst doğrulamada (S5)", MUTABAKATTA: "Mutabakatta", ITIRAZDA: "İtirazda", KESINLESTI: "Kesinleşti" };
const SUBKIND = { CEKIRDEK: "Çekirdek", LIDERLIK: "Liderlik", YAZILIM_ARAC: "Yazılım / Araç", MEVZUAT_STANDART: "Mevzuat / Standart", SUREC_METODOLOJI: "Süreç / Metodoloji", URUN_ALAN: "Ürün / Alan bilgisi", EKIPMAN_ISLEM: "Ekipman / İşlem", DIL: "Dil" };
const UNIT_TYPES = { DIREKTORLUK: "Grup Müdürlüğü / Direktörlük", DEPARTMAN: "Müdürlük", SERVIS: "Servis / Ekip" };

let S = null;
function emptyState() {
  return { version: 1, createdAt: new Date().toISOString(), units: [], roles: [], people: [], competencies: [], profiles: [], evidence: [], assessments: [], history: [], snapshots: [], requests: [], techProcess: { active: false, startedAt: null, deadline: null, note: "", closedAt: null }, plans: [], stages: {}, audit: [], users: [], auth: { userId: null, viewAs: null }, currentUser: "admin", example: false };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* depolama kapalı olabilir */ } }
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { S = Object.assign(emptyState(), JSON.parse(raw)); migrate(); return; } } catch (e) {}
  S = emptyState(); seedExample(); save();
}
function migrate() {
  if (!S.users.length) S.users.push({ id: uid(), username: "admin", passHash: fallbackHash("Admin123!"), personId: null, isAdmin: true, createdAt: new Date().toISOString(), lastLogin: null, mustChange: false });
  S.assessments = S.assessments || []; S.history = S.history || []; S.snapshots = S.snapshots || []; S.requests = S.requests || []; S.techProcess = S.techProcess || { active: false, startedAt: null, deadline: null, note: "", closedAt: null };
  if (Array.isArray(S.cycles) && S.cycles.length) { // eski döngü modelinden geçiş
    S.cycles.forEach(c => { const as = (c.assessments || []).map(a => Object.assign({ round: 1 }, a, { status: a.status === "KILITLI" ? "KESINLESTI" : a.status })); if (c.status === "KILITLI") S.snapshots.push({ id: uid(), name: c.name, at: c.lockedAt || new Date().toISOString(), assessments: as.map(a => Object.assign({}, a, { frozen: true })), metrics: c.metrics || { lines: 0, agreedRatio: 0, selfMinusProven: 0, appeals: 0, appealRatio: 0 } }); else as.forEach(a => { if (!S.assessments.some(x => x.personId === a.personId)) S.assessments.push(a); }); });
    delete S.cycles;
  }
  S.plans.forEach(p => { p.actions = p.actions || []; delete p.cycleId; });
  const seen = new Set(); S.plans = S.plans.filter(p => { if (seen.has(p.personId)) return false; seen.add(p.personId); return true; });
}
function fallbackHash(pw) { let h = 5381; for (const ch of "yys|" + pw) h = (Math.imul(h, 33) ^ ch.charCodeAt(0)) >>> 0; return "x" + h.toString(16); }
async function hashPw(pw) { try { if (crypto && crypto.subtle) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("yys|" + pw)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); } } catch (e) {} return fallbackHash(pw); }
async function verifyPw(pw, hash) { return hash === fallbackHash(pw) || hash === (await hashPw(pw)); }
function audit(action, detail) { S.audit.unshift({ at: new Date().toISOString(), by: S.currentUser, action, detail: detail || "" }); if (S.audit.length > 2000) S.audit.length = 2000; }

function sampleCompetency(code, name, kind, subKind, def, rows) {
  const levels = {};
  for (let l = 1; l <= 5; l++) levels[l] = { anchor: "", indicators: [] };
  rows.forEach(([l, text, mandatory, ev]) => levels[l].indicators.push({ id: uid(), text, mandatory, evidenceTypes: ev, validity: 24 }));
  return { id: uid(), code, name, kind, subKind, definition: def, boundary: "", criticality: 2, status: "AKTIF", version: 1, levels };
}
function seedExample() {
  S.example = true;
  const grup = { id: uid(), parentId: null, type: "DIREKTORLUK", name: "İnsan Kaynakları Grup Müdürlüğü", managerId: null };
  const m1 = { id: uid(), parentId: grup.id, type: "DEPARTMAN", name: "İşe Alım Müdürlüğü", managerId: null };
  const m2 = { id: uid(), parentId: grup.id, type: "DEPARTMAN", name: "Yetenek ve Yetkinlik Yönetimi", managerId: null };
  S.units.push(grup, m1, m2);
  const rGM = { id: uid(), name: "Grup Müdürü", family: "İK Yönetimi", grade: 6, isManager: true };
  const rM = { id: uid(), name: "Müdür", family: "İK Yönetimi", grade: 5, isManager: true };
  const rU = { id: uid(), name: "İK Uzmanı", family: "İnsan Kaynakları", grade: 2, isManager: false };
  const rUY = { id: uid(), name: "İK Uzman Yardımcısı", family: "İnsan Kaynakları", grade: 1, isManager: false };
  S.roles.push(rGM, rM, rU, rUY);
  const p = (no, name, unitId, roleId) => ({ id: uid(), no, name, email: "", unitId, roleId, active: true });
  const gm = p("1001", "Ayşe Yılmaz (örnek)", grup.id, rGM.id);
  const md1 = p("2001", "Can Aydın (örnek)", m1.id, rM.id);
  const md2 = p("2002", "Elif Kaya (örnek)", m2.id, rM.id);
  const u1 = p("3001", "Zeynep Arslan (örnek)", m1.id, rU.id);
  const u2 = p("3002", "Mehmet Demir (örnek)", m1.id, rUY.id);
  const u3 = p("3003", "Selin Koç (örnek)", m2.id, rU.id);
  S.people.push(gm, md1, md2, u1, u2, u3);
  grup.managerId = gm.id; m1.managerId = md1.id; m2.managerId = md2.id;
  S.users.push({ id: uid(), username: "admin", passHash: fallbackHash("Admin123!"), personId: null, isAdmin: true, createdAt: new Date().toISOString(), lastLogin: null, mustChange: false });
  for (const x of [gm, md1, md2, u1, u2, u3]) S.users.push({ id: uid(), username: x.no, passHash: fallbackHash(x.no), personId: x.id, isAdmin: false, createdAt: new Date().toISOString(), lastLogin: null, mustChange: true });
  const c1 = sampleCompetency("D-C-01", "Sürekli Öğrenme", "DAVRANISSAL", "CEKIRDEK", "Yeni bilgi ve yöntemleri kendiliğinden arar, uygular ve paylaşır.", [
    [1, "Atanan zorunlu eğitimleri süresinde tamamladı", true, ["SERTIFIKA_SINAV"]], [1, "Yöneticisinin önerdiği bir öğrenme kaynağını bitirip kısa özetini paylaştı", false, ["IS_CIKTISI"]], [1, "Yeni bir mevzuat veya ürün değişikliğini sorarak öğrendi ve notlarını ekiple paylaştı", false, ["GOZLEM_NOTU"]],
    [2, "Kendi alanındaki bir mevzuat veya ürün değişikliğini işine yansıttı", true, ["IS_CIKTISI", "GOZLEM_NOTU"]], [2, "Son 12 ayda bir öğrenme etkinliğine kendi isteğiyle katıldı", false, ["SERTIFIKA_SINAV"]], [2, "Öğrendiği bir yöntemi bir iş çıktısında uyguladı", false, ["IS_CIKTISI"]],
    [3, "Kendi belirlediği bir öğrenme hedefini 12 ayda tamamladı", true, ["SERTIFIKA_SINAV", "IS_CIKTISI"]], [3, "Öğrendiği bir konuyu ekiple paylaştı (sunum, yazı veya atölye)", true, ["IS_CIKTISI", "MENTORLUK_KAYDI"]], [3, "Öğrendiğini işine uygulayıp ölçülebilir bir sonuç aldı", false, ["OLCULEBILIR_SONUC"]],
    [4, "Ekibi veya birimi için bir öğrenme programı ya da kılavuz tasarladı", true, ["IS_CIKTISI"]], [4, "En az iki kişiye mentorluk yaptı", false, ["MENTORLUK_KAYDI"]], [4, "Birimde bir öğrenme ritüeli başlattı ve sürdürdü", false, ["GOZLEM_NOTU"]],
    [5, "Kurum çapında bir öğrenme pratiği kurdu veya dış toplulukta içerik üretti", true, ["IS_CIKTISI", "PAYDAS_GERI_BILDIRIM"]], [5, "Başka birimlerin öğrenme programlarına danışmanlık yaptı", false, ["PAYDAS_GERI_BILDIRIM"]], [5, "Kurumun öğrenme stratejisine kabul edilen bir öneri geliştirdi", false, ["IS_CIKTISI"]]]);
  const c2 = sampleCompetency("D-C-02", "Süreç Odaklılık", "DAVRANISSAL", "CEKIRDEK", "İşi adımlar, standartlar ve iyileştirme döngüsü olarak görür.", [
    [1, "Tanımlı süreç adımlarını kontrol listesiyle takip etti", true, ["GOZLEM_NOTU"]], [1, "Süreç dokümanını okuyup kendi görevindeki adımları özetledi", false, ["IS_CIKTISI"]], [1, "Bir sapmayı fark edip yöneticisine bildirdi", false, ["GOZLEM_NOTU"]],
    [2, "Sürecindeki bir sapmayı tespit edip kayıt altına aldı", true, ["IS_CIKTISI"]], [2, "Süreç ölçümlerini (süre, hata) düzenli raporladı", false, ["IS_CIKTISI"]], [2, "Süreç değişikliğini ekibine aktardı", false, ["GOZLEM_NOTU"]],
    [3, "Sürecin darboğazını veriyle tespit edip iyileştirme önerdi ve uyguladı", true, ["IS_CIKTISI", "OLCULEBILIR_SONUC"]], [3, "İyileştirme sonrası ölçülebilir kazanım raporladı", false, ["OLCULEBILIR_SONUC"]], [3, "Yeni çalışana süreci öğretti", false, ["MENTORLUK_KAYDI"]],
    [4, "Birim için bir süreci baştan tasarladı ve standartlaştırdı", true, ["IS_CIKTISI"]], [4, "Süreç ölçüm sistemi kurdu ve birime raporladı", false, ["IS_CIKTISI"]], [4, "Birimler arası bir süreç arayüzünü netleştirdi", false, ["PAYDAS_GERI_BILDIRIM"]],
    [5, "Kurum çapında süreç mimarisine kabul edilen bir öneri geliştirdi", true, ["IS_CIKTISI"]], [5, "Sürekli iyileştirme programını kurum düzeyinde kurdu", false, ["IS_CIKTISI"]], [5, "Dış kıyaslama yapıp kuruma uyarladı", false, ["IS_CIKTISI"]]]);
  const c3 = sampleCompetency("T-IK-001", "İşe Alım ve Seçme Değerlendirme", "TEKNIK", "SUREC_METODOLOJI", "Rol profiline göre aday bulma, yapılandırılmış mülakat ve puan kartıyla değerlendirme, karar ve teklif süreçlerinin yürütülmesi.", [

      checks: [["Profilsiz kişi yok", unprofiled === 0, `${unprofiled} kişi`, true], ["Yapısal hatası olan rol yok (satır > 30)", roleErrors === 0, `${roleErrors} rol`, true], ["Her rolde en az 1 teknik beceri", rolesNoTech === 0, `${rolesNoTech} rolde teknik yok`, false]] },

      checks: [["Öz-beyanı tamamlayan ≥ %90", nA > 0 && selfDone / nA >= 0.9, pc(selfDone), true], ["Yönetici doğrulaması ≥ %90", nA > 0 && mgrDone / nA >= 0.9, pc(mgrDone), true], ["Seviye 5 onayı bekleyen yok", l5pending === 0, `${l5pending} bekliyor`, false]] },
    { key: "mutabakat", title: "Mutabakat ve itiraz", summary: "Görüşme, mutabık seviye, çalışan onayı veya itiraz, grup müdürü kararı.", guidance: ["Fark ≥ 2 veya reddedilmiş zorunlu kanıt varsa görüşme zorunlu; görüşme notu yazılır.", "Mutabık seviye kanıtlanmış seviyeyi aşamaz; çalışan onaylar ya da gerekçeli itiraz eder.", "İtirazlar Üst doğrulama / itiraz sayfasında kanıt üzerinden karara bağlanır; değerlendirme kesinleşir."], link: "ekipdeg",

    { key: "raporlar", title: "Raporlar, kalibrasyon ve gelişim planı", summary: "Isı haritası, bayraklar, öğrenim ölçütleri; kalibrasyon oturumu; kişi başı 3 öncelikli plan.", guidance: ["Raporlar sayfasında ısı haritası, dağılım, bus factor ve cömertlik endeksine bakın; 90 dakikalık kalibrasyon oturumu yapın (seviye değişmez, kanıt görevi açılır).", "İsterseniz \"Dönemi kaydet\" ile anlık görüntü alın; sonraki dönemle karşılaştırırsınız.", "Her çalışan ilk 3 önceliğinden eylem ekler (eksik gösterge = iş); yönetici planı onaylar. Yeni kanıtlar birikince \"Yeni tur\" ile yeniden değerlendirilir.", "Öğrenim ölçütlerinin 7/9'u sağlanırsa genişleme kararı."], link: "raporlar",
      checks: [["Eylemi olan gelişim planı oranı ≥ %80", everFinal > 0 && planned / everFinal >= 0.8, everFinal ? `${pct(planned / everFinal)} (${planned}/${everFinal})` : "kesinleşen değerlendirme yok", true], ["Yönetici onaylı plan oranı ≥ %80", everFinal > 0 && approvedPlans / everFinal >= 0.8, everFinal ? pct(approvedPlans / everFinal) : "—", false], ["En az bir dönem kaydı", S.snapshots.length > 0, `${S.snapshots.length} kayıt`, false]] },
  ];
  st.forEach(s => { s.autoOk = s.checks.filter(c => c[3]).every(c => c[1]); s.confirmed = S.stages[s.key] || null; });
  let cur = st.findIndex(s => !s.confirmed); if (cur < 0) cur = st.length - 1;
  return { stages: st, current: cur };
}

// ===================== Ekranlar =====================
const V = {};
V.ozet = () => {
  const { stages, current } = computeStages();
  const people = S.people.filter(p => p.active);
  const tiles = [["Birim", S.units.length], ["Rol", S.roles.length], ["Kişi", people.length], ["Aktif yetkinlik", S.competencies.filter(c => c.status === "AKTIF").length], ["Kanıt", S.evidence.length], ["Bekleyen kanıt", S.evidence.filter(e => e.status === "SUNULDU").length]];
  let h = `<h1>Özet ve aşamalar</h1><p class="lead">Sistem şu anda <b>${current + 1}. aşamada: ${esc(stages[current].title)}</b>. Her aşamanın otomatik kontrolleri sağlanınca İK onaylar; sonraki aşama açılır. Kontroller tavsiyedir, önceki aşamaya her zaman dönülebilir.</p>`;
  if (S.example) h += `<div class="msg warn">Örnek veri yüklü (adların yanında "(örnek)"). Gerçek kuruluma başlarken <a href="#yedek" data-go="yedek">Yedek ve veri</a> sayfasından örnek veriyi temizleyin.</div>`;
  h += flashHtml();
  h += `<div class="grid" style="margin-bottom:14px">${tiles.map(([k, v]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>`;
  h += `<div class="steps">${stages.map((s, i) => `<span class="${s.confirmed ? "done" : i === current ? "cur" : ""}">${i + 1}. ${esc(s.title)}</span>`).join("")}</div>`;
  stages.forEach((s, i) => {
    h += `<details class="card ${i === current ? "current" : ""}" ${i === current ? "open" : ""}><summary>${i + 1}. ${esc(s.title)} ${s.confirmed ? `<span class="badge ok">onaylandı · ${fmtDate(s.confirmed.at)}</span>` : s.autoOk ? `<span class="badge ok">kontroller tamam</span>` : `<span class="badge warn">kontroller eksik</span>`}</summary><p class="small muted">${esc(s.summary)}</p>
    <ul class="small">${s.guidance.map(g => `<li>${esc(g)}</li>`).join("")}</ul>
    <table><thead><tr><th>Kontrol</th><th>Durum</th><th>Ayrıntı</th></tr></thead><tbody>${s.checks.map(c => `<tr><td>${esc(c[0])} ${c[3] ? "" : '<span class="badge mute">tavsiye</span>'}</td><td>${c[1] ? '<span class="ok">✓</span>' : '<span class="warn">△</span>'}</td><td class="small muted">${esc(c[2])}</td></tr>`).join("")}</tbody></table>
    <div class="row" style="margin-top:8px"><button class="btn s" data-go="${s.link}">Sayfaya git</button>${isAdmin() ? (s.confirmed ? `<button class="btn s" data-unconfirm="${s.key}">Onayı geri al</button>` : `<button class="btn s p" data-confirm="${s.key}" ${s.autoOk ? "" : 'title="Zorunlu kontroller eksik; yine de onaylanabilir"'}>Aşamayı onayla</button>`) : ""}</div>
    ${s.confirmed && s.confirmed.note ? `<p class="small muted" style="margin-top:6px">Not: ${esc(s.confirmed.note)}</p>` : ""}</details>`;
  });
  return h;
};
V.ozet.bind = () => {
  $("#main").querySelectorAll("[data-confirm]").forEach(b => b.onclick = () => confirmBox("Aşamayı onayla", "Bu aşamayı tamamlandı olarak işaretliyorsunuz. İsterseniz kısa bir not bırakın.", v => { S.stages[b.dataset.confirm] = { at: new Date().toISOString(), by: S.currentUser, note: v }; audit("STAGE_CONFIRM", b.dataset.confirm); save(); note("ok", "Aşama onaylandı."); }, { input: "Not (isteğe bağlı)", yes: "Onayla" }));
  $("#main").querySelectorAll("[data-unconfirm]").forEach(b => b.onclick = () => { delete S.stages[b.dataset.unconfirm]; audit("STAGE_UNCONFIRM", b.dataset.unconfirm); save(); note("ok", "Onay geri alındı."); });
};

// ---------- Kurulum
V.kurulum = () => {

  const tree = pid => `<ul>${S.units.filter(u => (u.parentId || null) === pid).map(u => { const m = person(u.managerId); const n = S.people.filter(p => p.active && p.unitId === u.id).length; return `<li><b>${esc(u.name)}</b> <span class="badge mute">${UNIT_TYPES[u.type] || u.type}</span> <span class="small muted">yönetici: ${m ? esc(m.name) : '<span class="warn">atanmamış</span>'} · ${n} kişi</span> <button class="btn s" data-eu="${u.id}">Düzenle</button> <button class="btn s danger" data-du="${u.id}">Sil</button>${tree(u.id)}</li>`; }).join("")}</ul>`;
  const eu = param && param.unit ? unit(param.unit) : null;
  const er = param && param.role ? role(param.role) : null;
  const ep = param && param.person ? person(param.person) : null;
  let h = `<h1>Kurulum</h1><p class="lead">Birimleri (grup müdürlüğü, müdürlükler, servisler), rolleri ve kişileri burada ekler, düzenler, silersiniz. Yönetici zinciri birim yöneticisinden türer: bir kişinin yöneticisi, bağlı olduğu birimin (veya üst biriminin) yöneticisidir.</p>` + flashHtml();
  h += `<div class="card"><h2>Birimler</h2><div class="tree">${tree(null)}</div>
  <form id="fUnit" class="form" style="margin-top:10px"><input type="hidden" name="id" value="${eu ? eu.id : ""}"><label>Birim adı<input name="name" required value="${esc(eu ? eu.name : "")}"></label><label>Tür<select name="type">${Object.entries(UNIT_TYPES).map(([k, v]) => `<option value="${k}" ${eu && eu.type === k ? "selected" : ""}>${v}</option>`).join("")}</select></label><label>Üst birim<select name="parentId"><option value="">— (en üst)</option>${opt(S.units.filter(u => !eu || u.id !== eu.id), eu ? eu.parentId : (S.units[0] || {}).id)}</select></label><label>Yönetici<select name="managerId"><option value="">— atanmamış</option>${opt(S.people.filter(p => p.active), eu ? eu.managerId : null)}</select></label><div class="row"><button class="btn p">${eu ? "Kaydet" : "Birim ekle"}</button>${eu ? '<button type="button" class="btn" data-cancel>Vazgeç</button>' : ""}</div></form></div>`;
  h += `<div class="card"><h2>Roller</h2><div class="tbl"><table><thead><tr><th>Rol</th><th>Aile</th><th>Kademe</th><th>Yönetici rolü</th><th>Kişi</th><th>Profil satırı</th><th></th></tr></thead><tbody>${S.roles.slice().sort((a, b) => a.grade - b.grade).map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.family || "")}</td><td>${r.grade}</td><td>${r.isManager ? "Evet" : "—"}</td><td>${S.people.filter(p => p.active && p.roleId === r.id).length}</td><td>${S.profiles.filter(p => p.roleId === r.id).length}</td><td class="row"><button class="btn s" data-er="${r.id}">Düzenle</button><button class="btn s danger" data-dr="${r.id}">Sil</button></td></tr>`).join("") || '<tr><td colspan="7" class="muted">Rol yok.</td></tr>'}</tbody></table></div>
  <form id="fRole" class="form" style="margin-top:10px"><input type="hidden" name="id" value="${er ? er.id : ""}"><label>Rol adı<input name="name" required value="${esc(er ? er.name : "")}"></label><label>Rol ailesi<input name="family" value="${esc(er ? er.family : "")}" placeholder="İnsan Kaynakları"></label><label>Kademe (1 = en alt)<input name="grade" type="number" min="1" max="12" value="${er ? er.grade : 2}"></label><label><input type="checkbox" name="isManager" ${er && er.isManager ? "checked" : ""}> Yönetici rolü</label><div class="row"><button class="btn p">${er ? "Kaydet" : "Rol ekle"}</button>${er ? '<button type="button" class="btn" data-cancel>Vazgeç</button>' : ""}</div></form></div>`;
  h += `<div class="card"><h2>Kişiler</h2><div class="tbl"><table><thead><tr><th>Sicil</th><th>Ad Soyad</th><th>Birim</th><th>Rol</th><th>Yönetici</th><th>Durum</th><th></th></tr></thead><tbody>${S.people.slice().sort((a, b) => a.name.localeCompare(b.name, "tr")).map(p => { const m = person(managerOf(p.id)); return `<tr class="${p.active ? "" : "muted"}"><td class="mono">${esc(p.no)}</td><td>${esc(p.name)}</td><td class="small">${esc(unitPath(p.unitId))}</td><td>${esc((role(p.roleId) || {}).name || '<span class="warn">rol yok</span>')}</td><td class="small">${m ? esc(m.name) : "—"}</td><td>${p.active ? '<span class="badge ok">aktif</span>' : '<span class="badge mute">ayrıldı</span>'}</td><td class="row"><button class="btn s" data-ep="${p.id}">Düzenle</button><button class="btn s danger" data-dp="${p.id}">Sil</button></td></tr>`; }).join("") || '<tr><td colspan="7" class="muted">Kişi yok.</td></tr>'}</tbody></table></div>

  <details style="margin-top:10px"><summary>Toplu kişi ekle (CSV yapıştır)</summary><p class="small muted">Her satır: <code>sicil;ad soyad;birim adı;rol adı;e-posta</code>. Birim ve rol adları yukarıdakilerle birebir aynı olmalı. Aynı sicil varsa güncellenir.</p><textarea id="csvPeople" rows="5" class="json" placeholder="3004;Ali Veli;İşe Alım Müdürlüğü;İK Uzmanı;ali@banka.com"></textarea><div class="row" style="margin-top:6px"><button class="btn" id="csvGo">Aktar</button></div></details></div>`;
  return h;
};
V.kurulum.bind = () => {
  const m = $("#main"); if (!$("#fUnit")) return;
  const fd = f => Object.fromEntries(new FormData(f).entries());
  m.querySelectorAll("[data-cancel]").forEach(b => b.onclick = () => go("kurulum"));
  m.querySelectorAll("[data-eu]").forEach(b => b.onclick = () => go("kurulum", { unit: b.dataset.eu }));
  m.querySelectorAll("[data-er]").forEach(b => b.onclick = () => go("kurulum", { role: b.dataset.er }));
  m.querySelectorAll("[data-ep]").forEach(b => b.onclick = () => go("kurulum", { person: b.dataset.ep }));
  $("#fUnit").onsubmit = e => { e.preventDefault(); const d = fd(e.target); if (d.parentId && d.id) { let u = unit(d.parentId), g = 0; while (u && g++ < 30) { if (u.id === d.id) return note("bad", "Bir birim kendi altına taşınamaz."); u = unit(u.parentId); } }
    if (d.id) { Object.assign(unit(d.id), { name: d.name.trim(), type: d.type, parentId: d.parentId || null, managerId: d.managerId || null }); audit("UNIT_UPDATE", d.name); } else { S.units.push({ id: uid(), name: d.name.trim(), type: d.type, parentId: d.parentId || null, managerId: d.managerId || null }); audit("UNIT_CREATE", d.name); }
    save(); param = null; note("ok", "Birim kaydedildi."); };
  m.querySelectorAll("[data-du]").forEach(b => b.onclick = () => { const u = unit(b.dataset.du); const kids = S.units.filter(x => x.parentId === u.id).length, ppl = S.people.filter(p => p.unitId === u.id).length; if (kids || ppl) return note("bad", `"${u.name}" silinemez: ${kids} alt birim, ${ppl} kişi bağlı. Önce onları taşıyın.`); confirmBox("Birimi sil", `"${u.name}" silinecek.`, () => { S.units = S.units.filter(x => x.id !== u.id); audit("UNIT_DELETE", u.name); save(); note("ok", "Birim silindi."); }, { danger: true, yes: "Sil" }); });
  $("#fRole").onsubmit = e => { e.preventDefault(); const d = fd(e.target); const v = { name: d.name.trim(), family: (d.family || "").trim(), grade: Math.max(1, +d.grade || 1), isManager: !!d.isManager }; if (d.id) { Object.assign(role(d.id), v); audit("ROLE_UPDATE", v.name); } else { S.roles.push(Object.assign({ id: uid() }, v)); audit("ROLE_CREATE", v.name); } save(); param = null; note("ok", "Rol kaydedildi."); };

    for (let l = 1; l <= 5; l++) { c.levels[l].anchor = (d.get("anchor" + l) || "").trim(); c.levels[l].indicators.forEach(i => { i.text = (d.get("t_" + i.id) || "").trim(); i.mandatory = d.get("m_" + i.id) === "on"; i.validity = +d.get("v_" + i.id) || 24; i.evidenceTypes = EVTYPES.map(e => e[0]).filter(k => d.get(`e_${i.id}_${k}`) === "on"); }); }
    if (c.kind === "TEKNIK") c.roleSuggestions = unitRoles(c.ownerUnitId || myUnitId()).filter(r => d.get("rs_" + r.id) === "on").map(r => ({ roleId: r.id, target: +d.get("rt_" + r.id) || 2, weight: +d.get("rw_" + r.id) || 2, mandatory: d.get("rm_" + r.id) === "on" })); };
  f.onsubmit = e => { e.preventDefault(); collect(); if (!c.code || !c.name) return note("bad", "Kod ve ad zorunlu."); if (S.competencies.some(x => x.id !== c.id && x.code === c.code)) return note("bad", "Bu kod başka yetkinlikte var."); audit("COMP_SAVE", c.code); save(); flash = { kind: "ok", text: "Kaydedildi." }; go("yetkinlik", { id: c.id }); };
  m.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { collect(); c.levels[b.dataset.add].indicators.push({ id: uid(), text: "", mandatory: c.levels[b.dataset.add].indicators.length === 0, evidenceTypes: ["IS_CIKTISI"], validity: 24 }); save(); go("yetkinlik", { id: c.id }); });
  m.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { collect(); const used = S.evidence.filter(e => e.indicatorIds.includes(b.dataset.del)).length; confirmBox("Göstergeyi sil", used ? `Bu göstergeye bağlı ${used} kanıt var; bağ kaldırılır.` : "Gösterge silinecek.", () => { for (let l = 1; l <= 5; l++) c.levels[l].indicators = c.levels[l].indicators.filter(i => i.id !== b.dataset.del); S.evidence.forEach(e => e.indicatorIds = e.indicatorIds.filter(x => x !== b.dataset.del)); save(); go("yetkinlik", { id: c.id }); }, { danger: true, yes: "Sil" }); });
  const applySuggestions = () => { let n = 0; (c.roleSuggestions || []).forEach(sg => { if (!role(sg.roleId)) return; const ex = S.profiles.find(p => p.roleId === sg.roleId && p.competencyId === c.id); if (ex) { ex.target = sg.target; ex.weight = sg.weight; ex.mandatory = sg.mandatory; } else { S.profiles.push({ roleId: sg.roleId, competencyId: c.id, target: sg.target, weight: sg.weight, mandatory: sg.mandatory }); n++; } }); return n; };
  m.querySelectorAll("[data-status]").forEach(b => b.onclick = () => { collect(); const st = b.dataset.status; const ready = canActivate(c) && !allIndicators(c).some(i => lintIndicator(i.text).some(x => x[0] === "HATA"));
    if ((st === "AKTIF" || (st === "INCELEMEDE" && mgrMode)) && !ready) return note("bad", "Her seviyede ≥3 gösterge, ≥1 zorunlu, tanım ve ifade hatası olmayan göstergeler gerekir.");
    if (st === "INCELEMEDE" && mgrMode) { c.status = "INCELEMEDE"; c.submittedAt = new Date().toISOString(); c.submittedBy = me().id; c.reviewNote = ""; audit("COMP_SUBMIT", c.code); save(); flash = { kind: "ok", text: "İK onayına gönderildi. Onaylanınca aktifleşir ve çalışanlara görünür." }; return go("teknik"); }
    const wasReview = c.status === "INCELEMEDE";
    c.status = st; if (st === "AKTIF") { c.version = (c.version || 0) + 1; c.approvedAt = new Date().toISOString(); c.reviewNote = ""; }
    let added = 0; if (st === "AKTIF" && (c.roleSuggestions || []).length) added = applySuggestions();
    audit("COMP_STATUS", c.code + " → " + st); save(); flash = { kind: "ok", text: st === "AKTIF" ? `Yetkinlik aktifleştirildi${wasReview ? " (müdürlük önerisi onaylandı)" : ""}; ${added ? `${added} rol profili satırı eklendi, ` : ""}çalışanlara görünür.` : "Durum: " + st }; go("yetkinlik", { id: c.id }); });
  const rc = $("#returnComp"); if (rc) rc.onclick = () => { collect(); confirmBox("Müdürlüğe geri gönder", "Ne düzeltilmeli? Not müdüre görünür.", v => { c.status = "TASLAK"; c.reviewNote = v; c.returnedAt = new Date().toISOString(); audit("COMP_RETURN", c.code); save(); flash = { kind: "ok", text: "Geri gönderildi; müdür düzeltip yeniden sunacak." }; go("kutuphane"); }, { input: "İK notu (≥ 10 karakter)", required: true, min: 10, yes: "Geri gönder" }); };
  const del = $("#delComp"); if (del) del.onclick = () => { const n = S.profiles.filter(p => p.competencyId === c.id).length; confirmBox("Yetkinliği sil", n ? `${n} rol profilinde kullanılıyor; satırlar ve bağlı kanıt bağları da silinir.` : "Yetkinlik silinecek.", () => { const ids = allIndicators(c).map(i => i.id); S.evidence.forEach(e => e.indicatorIds = e.indicatorIds.filter(x => !ids.includes(x))); S.profiles = S.profiles.filter(p => p.competencyId !== c.id); S.competencies = S.competencies.filter(x => x.id !== c.id); audit("COMP_DELETE", c.code); save(); flash = { kind: "ok", text: "Silindi." }; go(mgrMode ? "teknik" : "kutuphane"); }, { danger: true, yes: "Sil" }); };
};

// ---------- Teknik beceri tanımlama (müdür sayfası)

    exGoodBad(["Ad: \"İşe Alım ve Seçme Değerlendirme\" · Tanım: \"Rol profiline göre aday bulma, yapılandırılmış mülakat ve puan kartıyla değerlendirme, karar ve teklif süreçlerinin yürütülmesi.\" · S2: \"Standart bir pozisyonun işe alım sürecini bağımsız yürüttü.\""], ["Ad: \"İK\" (çok geniş)", "Tanım: \"İşe alım işleri\"", "S2: \"İşe alım yapabilir.\""]));
  h += `<div class="card"><div class="row"><h2 style="flex:1">Müdürlüğümüzün teknik becerileri (${mine.length})</h2>${tp.active ? '<button class="btn p" id="newTech">+ Yeni teknik beceri</button>' : ""}</div><div class="tbl"><table><thead><tr><th>Kod</th><th>Ad</th><th>Durum</th><th>Gösterge</th><th>Yapı</th><th>Önerilen rol</th><th>İK notu</th><th></th></tr></thead><tbody>${mine.map(c => { const n = allIndicators(c).length, err = structureIssues(c).filter(i => i[0] === "HATA").length + allIndicators(c).filter(i => lintIndicator(i.text).some(x => x[0] === "HATA")).length; return `<tr><td class="mono">${esc(c.code)}</td><td><b>${esc(c.name)}</b><div class="small muted">${esc(c.definition || "")}</div></td><td><span class="badge ${c.status === "AKTIF" ? "ok" : c.status === "INCELEMEDE" ? "" : "warn"}">${c.status === "AKTIF" ? "Onaylı · aktif" : c.status === "INCELEMEDE" ? "İK onayında" : c.reviewNote ? "Geri geldi" : "Taslak"}</span></td><td>${n}/15</td><td class="small">${err ? `<span class="bad">${err} hata</span>` : '<span class="ok">tamam</span>'}</td><td class="small">${(c.roleSuggestions || []).map(s => `${esc((role(s.roleId) || {}).name || "")} ${s.target}`).join(", ") || "—"}</td><td class="small warn">${esc(c.reviewNote || "")}</td><td><button class="btn s" data-open="${c.id}">${c.status === "TASLAK" ? "Düzenle" : "Gör"}</button></td></tr>`; }).join("") || '<tr><td colspan="8" class="muted">Henüz teknik beceri tanımlanmadı.</td></tr>'}</tbody></table></div></div>`;

V.teknik.bind = () => {

// ---------- Rol profilleri

  const rid = param && param.role || (roles[0] || {}).id; const r = role(rid);
  if (!isAdmin() && !isManagerUser()) return `<h1>Rol profilleri</h1><div class="msg warn">Bu sayfa yöneticiler içindir. Kendi profilinizi "Yetkinliklerim" sayfasında görürsünüz.</div>`;
  let h = `<h1>Rol profilleri${isAdmin() ? "" : " (salt okunur)"}</h1><p class="lead">Her rol için: hangi yetkinlikler, hangi hedef seviye, ağırlık (1–3) ve zorunlu mu. Hedef, "bu rolde 2 yıldır çalışan ve beklendiği gibi yapan kişi" içindir; ideal değil.${isAdmin() ? "" : " Profilleri İK tanımlar; değişiklik önerinizi İK'ya iletin."}</p>` + flashHtml();
  if (isAdmin()) h += guide("Bu aşamada ne yapacağız? (Aşama 3 · Rol profilleri)", ["Önce <b>\"Davranışsalları tüm rollere uygula\"</b>: kademeye göre hedef önerir (kademe 1 → 2, kademe 2–3 → 3, üstü → 4; yönetici ve liderlik ≥ 3).", "Sonra her role müdürlüğünün <b>teknik becerilerini</b> ekleyin; uzman yardımcısı 1–2, uzman 2–3, kıdemli 3, müdür 3–4.", "<b>Ağırlık:</b> rolün başarısına etkisi (3 = belirleyici). <b>Zorunlu:</b> bu seviye olmadan rol yapılamaz.", "Uyarılara bakın: kişi başı 30 satır üst sınır; her şey 4 ise hedef şişmiştir; yönetici rolünde liderlik olmalı."],
    exGoodBad(["İK Uzmanı → İşe Alım ve Seçme: hedef 3, ağırlık 3, zorunlu.", "İK Uzman Yardımcısı → aynı beceri: hedef 2, ağırlık 3, zorunlu.", "Müdür → Ekip Geliştirme (L): hedef 4, ağırlık 3."], ["Uzman Yardımcısına her beceride hedef 4 (ideal profil, beklenen değil).", "Yönetici rolüne hiç liderlik yetkinliği bağlamamak.", "Bir role 40 satır bağlamak (kişi başı 30 sınırı)."]));
  h += `<div class="row" style="margin-bottom:10px">${roles.map(x => `<button class="btn ${x.id === rid ? "p" : ""}" data-role="${x.id}">${esc(x.name)} <span class="small">(${S.profiles.filter(p => p.roleId === x.id).length})</span></button>`).join("")}${isAdmin() ? '<button class="btn" id="applyBeh" style="margin-left:auto">Davranışsalları tüm rollere uygula</button>' : ""}</div>`;
  if (!r) return h + `<div class="msg warn">Önce Kurulum sayfasından rol ekleyin.</div>`;
  const rows = profileRows(rid); const people = S.people.filter(p => p.active && p.roleId === rid);
  const warns = profileWarnings(rows, r.isManager, people.length > 0);
  h += `<div class="card"><h2>${esc(r.name)} <span class="badge mute">kademe ${r.grade}${r.isManager ? " · yönetici" : ""}</span> <span class="small muted">${people.length} kişi: ${esc(people.map(p => p.name).join(", "))}</span></h2>${warns.length ? `<div class="msg ${warns.some(w => w[0] === "HATA") ? "bad" : "warn"}">${warns.map(w => `${sevBadge(w[0])} ${esc(w[1])}`).join("<br>")}</div>` : '<div class="msg ok">Yapısal uyarı yok.</div>'}
  <form id="fProf"><div class="tbl"><table><thead><tr><th>Kod</th><th>Yetkinlik</th><th>Tür</th><th>Hedef</th><th>Ağırlık</th><th>Zorunlu</th><th></th></tr></thead><tbody>${rows.map(x => `<tr><td class="mono">${esc(x.code)}</td><td>${esc(x.name)} ${x.status !== "AKTIF" ? `<span class="badge warn">${x.status}</span>` : ""}</td><td class="small">${x.kind === "TEKNIK" ? "Teknik" : "Davranışsal"} · ${SUBKIND[x.subKind] || ""}</td><td><select name="t_${x.competencyId}" ${isAdmin() ? "" : "disabled"}>${lvOpts(5, x.target, x.kind).replace('value="0"', 'value="0" disabled')}</select></td><td><select name="w_${x.competencyId}" ${isAdmin() ? "" : "disabled"}>${[1, 2, 3].map(n => `<option value="${n}" ${x.weight === n ? "selected" : ""}>${n}</option>`).join("")}</select></td><td><input type="checkbox" name="m_${x.competencyId}" ${x.mandatory ? "checked" : ""} ${isAdmin() ? "" : "disabled"}></td><td>${isAdmin() ? `<button type="button" class="btn s danger" data-rm="${x.competencyId}">Kaldır</button>` : ""}</td></tr>`).join("") || '<tr><td colspan="7" class="muted">Bu role yetkinlik bağlanmamış.</td></tr>'}</tbody></table></div>${isAdmin() && rows.length ? '<div class="row" style="margin-top:8px"><button class="btn p">Kaydet</button></div>' : ""}</form>`;
  if (isAdmin()) { const avail = S.competencies.filter(c => c.status === "AKTIF" && !rows.some(x => x.competencyId === c.id)).sort((a, b) => a.code.localeCompare(b.code)); h += `<form id="fAdd" class="form" style="margin-top:12px"><label class="wide">Yetkinlik ekle (yalnız aktif olanlar)<select name="competencyId" required><option value="">— seçin</option>${avail.map(c => `<option value="${c.id}">${esc(c.code)} · ${esc(c.name)} (${c.kind === "TEKNIK" ? "T" : "D"})</option>`).join("")}</select></label><label>Hedef<select name="target">${lvOpts(5, 3).replace('value="0"', 'value="0" disabled')}</select></label><label>Ağırlık<select name="weight"><option>1</option><option selected>2</option><option>3</option></select></label><label><input type="checkbox" name="mandatory"> Zorunlu</label><div><button class="btn">Ekle</button></div></form>`; }
  h += `</div>`;
  return h;
};
V.profiller.bind = () => {
  const m = $("#main"); const rid = param && param.role || (S.roles.slice().sort((a, b) => a.grade - b.grade)[0] || {}).id;
  m.querySelectorAll("[data-role]").forEach(b => b.onclick = () => go("profiller", { role: b.dataset.role }));
  const ab = $("#applyBeh"); if (ab) ab.onclick = () => { const beh = S.competencies.filter(c => c.kind === "DAVRANISSAL" && c.status === "AKTIF"); if (!beh.length) return note("bad", "Aktif davranışsal yetkinlik yok."); let n = 0; for (const r of S.roles) for (const c of beh) { if (c.subKind === "LIDERLIK" && !r.isManager) continue; if (S.profiles.some(p => p.roleId === r.id && p.competencyId === c.id)) continue; S.profiles.push({ roleId: r.id, competencyId: c.id, target: defaultBehTarget(r.grade, r.isManager, c.subKind), weight: c.subKind === "LIDERLIK" ? 3 : 2, mandatory: false }); n++; } audit("PROFILE_APPLY_BEH", `${n} satır`); save(); flash = { kind: "ok", text: `${n} satır eklendi (liderlik yalnız yönetici rollerine).` }; go("profiller", { role: rid }); };
  const fp = $("#fProf"); if (fp) fp.onsubmit = e => { e.preventDefault(); const d = new FormData(fp); S.profiles.filter(p => p.roleId === rid).forEach(p => { p.target = +d.get("t_" + p.competencyId) || p.target; p.weight = +d.get("w_" + p.competencyId) || p.weight; p.mandatory = d.get("m_" + p.competencyId) === "on"; }); audit("PROFILE_SAVE", (role(rid) || {}).name); save(); flash = { kind: "ok", text: "Profil kaydedildi." }; go("profiller", { role: rid }); };
  m.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { S.profiles = S.profiles.filter(p => !(p.roleId === rid && p.competencyId === b.dataset.rm)); audit("PROFILE_REMOVE", b.dataset.rm); save(); go("profiller", { role: rid }); });
  const fa = $("#fAdd"); if (fa) fa.onsubmit = e => { e.preventDefault(); const d = Object.fromEntries(new FormData(fa).entries()); if (!d.competencyId) return; S.profiles.push({ roleId: rid, competencyId: d.competencyId, target: +d.target || 3, weight: +d.weight || 2, mandatory: !!d.mandatory }); audit("PROFILE_ADD", d.competencyId); save(); go("profiller", { role: rid }); };
};

// ===================== Kanıt =====================
function canSee(pid) { if (isAdmin()) return true; const m = me(); if (!m) return false; if (m.id === pid) return true; if (isUpper()) return true; let x = managerOf(pid), g = 0; while (x && g++ < 30) { if (x === m.id) return true; x = managerOf(x); } return false; }
function lintEvidence(e) { const out = []; const t = (e.what || "").trim(); if (t.length < 25) out.push(["HATA", "Açıklama çok kısa; ne yaptınız, ne çıktı, ne zaman?"]); if (/\b(yapabilirim|yaparım|bilirim|biliyorum|yapabiliyorum|hâkimim|hakimim)\b/i.test(t)) out.push(["HATA", "\"yaparım / bilirim\" kanıt değildir; yaptığınız somut işi yazın (\"…yürüttüm\", \"…hazırladım\")."]); if (!e.end) out.push(["HATA", "Bitiş (veya gerçekleşme) tarihi zorunlu."]); else if (e.end > today()) out.push(["HATA", "Tarih gelecekte olamaz."]); else if (!evidenceValid(e.end, 24)) out.push(["UYARI", "24 aydan eski; seviye hesabında sayılmaz."]); if (!e.indicatorIds.length) out.push(["HATA", "En az bir gösterge seçin."]); if (!(e.result || "").trim() && !e.isObservation) out.push(["UYARI", "Sonuç/çıktı boş: sayı, belge adı veya etki yazın."]); if (!(e.verifier || "").trim() && !e.isObservation) out.push(["UYARI", "Doğrulayıcı boş: kim teyit edebilir?"]); return out; }
function indicatorPicker(pid, selected, name) {
  const p = person(pid); const rows = personRows(pid);
  if (!rows.length) return `<div class="msg warn">Bu kişinin rolüne yetkinlik bağlanmamış; önce rol profili tanımlanmalı.</div>`;
  return `<div class="pick">${rows.map(r => { const c = comp(r.competencyId); return `<div style="margin:4px 0"><b>${esc(c.code)} · ${esc(c.name)}</b> <span class="small muted">hedef ${r.target}</span>${allIndicators(c).map(i => `<label><input type="checkbox" name="${name}" value="${i.id}" ${selected.includes(i.id) ? "checked" : ""}><span class="lv">S${i.level}${i.mandatory ? "*" : ""}</span><span>${esc(i.text)} <span class="muted small">(${(i.evidenceTypes || []).map(k => (EVTYPES.find(x => x[0] === k) || [])[1] || k).join(", ")})</span></span></label>`).join("")}</div>`; }).join("")}</div><div class="small muted">* zorunlu gösterge. Bir kanıt birden çok göstergeyi karşılayabilir; yalnız gerçekten karşıladıklarını işaretleyin.</div>`;
}

const FINAL = ["KESINLESTI"];
function newLine(r) { return { competencyId: r.competencyId, target: r.target, weight: r.weight, mandatory: r.mandatory, self: null, mgr: null, mgrNote: "", proven: 0, next: 0, agreed: null, meetingRequired: false, note: "", appealFlag: false, appealReason: null, appealDecision: null, appealNote: null, l5Candidate: false, l5Validated: null, rejectedMandatory: false }; }
/** Kişinin güncel değerlendirmesi; yoksa (ve rol profili varsa) oluşturulur. Kesinleşmemişse satırlar rol profiliyle eşitlenir. */
function currentAssessment(pid, create) {
  const p = person(pid); if (!p) return null;
  let a = S.assessments.find(x => x.personId === pid);
  const rows = personRows(pid);
  if (!a) { if (!create || !rows.length) return null; a = { id: uid(), personId: pid, roleId: p.roleId, managerId: managerOf(pid), status: "ACILDI", round: S.history.filter(h => h.personId === pid).length + 1, meetingNote: "", createdAt: new Date().toISOString(), lines: rows.map(newLine) }; S.assessments.push(a); save(); return a; }
  if (!FINAL.includes(a.status)) { a.managerId = managerOf(pid); a.roleId = p.roleId; rows.forEach(r => { const l = a.lines.find(x => x.competencyId === r.competencyId); if (l) { l.target = r.target; l.weight = r.weight; l.mandatory = r.mandatory; } else a.lines.push(newLine(r)); }); a.lines = a.lines.filter(l => rows.some(r => r.competencyId === l.competencyId)); }
  return a;
}
function startNewRound(pid) { const a = S.assessments.find(x => x.personId === pid); if (a) { S.history.push(Object.assign({}, a, { archivedAt: new Date().toISOString() })); S.assessments = S.assessments.filter(x => x.personId !== pid); } return currentAssessment(pid, true); }
function liveLines(a) {
  if (FINAL.includes(a.status) || a.frozen) return a.lines.map(l => { const c = comp(l.competencyId) || {}; return Object.assign({}, l, { live: false, indicators: [], code: c.code, name: c.name, kind: c.kind, pending: 0 }); });
  const l5map = {}; a.lines.forEach(l => { if (l.l5Validated) l5map[l.competencyId] = true; });
  const pr = provenFor(a.personId, a.roleId, l5map);
  return a.lines.map(l => { const p = pr.find(x => x.competencyId === l.competencyId) || { proven: 0, claimed: 0, next: 0, indicators: [], l5Candidate: false, rejectedMandatory: false }; const c = comp(l.competencyId) || {}; return Object.assign({}, l, { live: true, code: c.code, name: c.name, kind: c.kind, proven: p.proven, claimed: p.claimed, next: p.next, indicators: p.indicators, l5Candidate: p.l5Candidate, rejectedMandatory: p.rejectedMandatory, pending: p.indicators.reduce((s, i) => s + i.pending, 0) }); });
}
function freezeLines(a) { const lv = liveLines(a); a.lines.forEach(l => { const v = lv.find(x => x.competencyId === l.competencyId); if (!v) return; l.proven = v.proven; l.next = v.next; l.l5Candidate = v.l5Candidate; l.rejectedMandatory = v.rejectedMandatory; if (l.agreed != null) l.agreed = Math.min(l.agreed, v.proven); }); }
const lineTable = lines => `<div class="tbl"><table><thead><tr><th>Yetkinlik</th><th>Hedef</th><th>Öz-beyan</th><th>Yönetici görüşü</th><th>Kanıtlanmış</th><th>Sonrakine</th><th>Mutabık</th><th>Durum</th></tr></thead><tbody>${lines.map(l => { const c = comp(l.competencyId) || {}; const gap = l.target - (l.agreed != null ? l.agreed : l.proven); return `<tr class="${l.meetingRequired ? "hl" : ""}"><td><span class="mono">${esc(c.code || "")}</span> ${esc(c.name || "")}${l.mandatory ? ' <span class="badge warn">zorunlu</span>' : ""}</td><td>${badgeLv(l.target, c.kind)}</td><td>${l.self != null ? badgeLv(l.self, c.kind) : (l.live ? `<span class="small muted">iddia ${l.claimed}</span>` : "—")}</td><td>${l.mgr != null ? badgeLv(l.mgr, c.kind) + (l.mgr > l.proven ? ' <span class="small warn" title="Görüş kanıtın üstünde; gözlem notuyla kanıtlanmalı">▲</span>' : "") : "—"}${l.mgrNote ? `<div class="small muted">${esc(l.mgrNote)}</div>` : ""}</td><td>${badgeLv(l.proven, c.kind)}${l.l5Candidate ? (l.l5Validated === true ? ' <span class="badge ok">S5 onaylı</span>' : l.l5Validated === false ? ' <span class="badge bad">S5 red</span>' : ' <span class="badge warn">S5 üst onay bekliyor</span>') : ""}</td><td>${bar(l.next || 0)}</td><td>${l.agreed != null ? badgeLv(l.agreed, c.kind) : "—"}</td><td class="small">${gap > 0 ? `<span class="warn">açık ${gap}</span>` : '<span class="ok">hedefte</span>'}${l.meetingRequired ? ' · <b>görüşme zorunlu</b>' : ""}${l.rejectedMandatory ? ' · <span class="bad">zorunlu kanıt reddedildi</span>' : ""}${l.appealFlag ? ' · <span class="badge bad">itiraz</span>' : ""}${l.appealDecision ? ` · itiraz: ${l.appealDecision}` : ""}${l.note ? `<div class="muted">Not: ${esc(l.note)}</div>` : ""}${l.appealReason ? `<div class="muted">İtiraz gerekçesi: ${esc(l.appealReason)}</div>` : ""}${l.appealNote ? `<div class="muted">Karar: ${esc(l.appealNote)}</div>` : ""}</td></tr>`; }).join("")}</tbody></table></div>`;
const historyBox = pid => { const hs = S.history.filter(h => h.personId === pid).slice().reverse(); return hs.length ? `<details style="margin-top:8px"><summary>Önceki turlar (${hs.length})</summary>${hs.map(h => `<div class="small" style="margin:6px 0"><b>Tur ${h.round}</b> · kesinleşme ${fmtDate(h.finalizedAt)} · ${h.lines.map(l => `${esc((comp(l.competencyId) || {}).code || "")} ${l.agreed != null ? l.agreed : l.proven}`).join(" · ")}</div>`).join("")}</details>` : ""; };

V.degerlendirme = () => {

  const pend = lines.reduce((s, l) => s + (l.pending || 0), 0);
  if (a.status === "ACILDI") h += `<div class="row" style="margin-top:10px">${pend ? `<span class="small warn">${pend} kanıtınız karar bekliyor; yine de tamamlayabilirsiniz.</span>` : ""}<button class="btn p" id="selfDone">Öz-beyanı tamamla</button><button class="btn" data-go="kanit">Kanıt ekle</button></div>`;

};

function myProcess() {
  const m = me(); if (!m) return null;
  const a = currentAssessment(m.id, false); const rows = personRows(m.id); const mine = S.evidence.filter(e => e.personId === m.id); const acc = mine.filter(e => e.status === "KABUL").length, pend = mine.filter(e => e.status === "SUNULDU").length, ek = mine.filter(e => e.status === "EK_BILGI").length;

    ["Mutabakat", st === "KESINLESTI", st === "MUTABAKATTA" ? "yanıtım bekleniyor" : st === "ITIRAZDA" ? "itirazım grup müdüründe" : st === "KESINLESTI" ? "kesinleşti" : "—", "degerlendirme", "Görüşme yaparız; mutabık seviyeyi onaylar ya da gerekçeli itiraz ederim."],
    ["Gelişim planı", !!pl && pl.actions.some(x => x.status !== "IPTAL"), pl ? `${pl.actions.filter(x => x.status !== "IPTAL").length} eylem${pl.status !== "TASLAK" ? " · onaylı" : ""}` : "plan yok", "gelisim", "İlk 3 önceliğim için eylem yazarım; yöneticim onaylar."],
  ];

    const as = team.map(pid => currentAssessment(pid, false)).filter(Boolean);
    const pe = S.evidence.filter(e => team.includes(e.personId) && e.status === "SUNULDU").length; const rq = S.requests.filter(r => team.includes(r.personId) && r.status === "BEKLIYOR").length;
    const v = as.filter(x => ["ACILDI", "OZ_BEYAN_TAMAM"].includes(x.status)).length, mu = as.filter(x => x.status === "YONETICI_TAMAM").length, wait = as.filter(x => ["MUTABAKATTA", "ITIRAZDA", "UST_DOGRULAMADA"].includes(x.status)).length, fin = as.filter(x => x.status === "KESINLESTI").length;
    const plans = team.filter(pid => { const p = S.plans.find(x => x.personId === pid); return p && p.status === "TASLAK" && p.actions.length; }).length;

  }

}

function exportJson() { return JSON.stringify(Object.assign({}, S, { auth: { userId: null, viewAs: null }, currentUser: "admin" }), null, 1); }
function mergeState(inc) {
  let n = { units: 0, roles: 0, people: 0, comps: 0, profiles: 0, evidence: 0, users: 0, cycles: 0, plans: 0 };
  const push = (arr, key, item) => { const i = arr.findIndex(x => x.id === item.id); if (i >= 0) arr[i] = item; else { arr.push(item); n[key]++; } };
  (inc.units || []).forEach(u => push(S.units, "units", u)); (inc.roles || []).forEach(r => push(S.roles, "roles", r)); (inc.people || []).forEach(p => push(S.people, "people", p)); (inc.competencies || []).forEach(c => push(S.competencies, "comps", c));
  (inc.profiles || []).forEach(p => { if (!S.profiles.some(x => x.roleId === p.roleId && x.competencyId === p.competencyId)) { S.profiles.push(p); n.profiles++; } });
  (inc.evidence || []).forEach(e => push(S.evidence, "evidence", e)); (inc.users || []).forEach(u => { if (!S.users.some(x => x.username === u.username)) { S.users.push(u); n.users++; } });
  (inc.assessments || []).forEach(a => { const i = S.assessments.findIndex(x => x.personId === a.personId); if (i >= 0) S.assessments[i] = a; else { S.assessments.push(a); n.cycles++; } });
  (inc.requests || []).forEach(r => push(S.requests, "cycles", r)); (inc.history || []).forEach(h => push(S.history, "cycles", h)); (inc.snapshots || []).forEach(x => push(S.snapshots, "cycles", x));
  (inc.plans || []).forEach(p => { const i = S.plans.findIndex(x => x.personId === p.personId); if (i >= 0) S.plans[i] = p; else { S.plans.push(p); n.plans++; } }); Object.assign(S.stages, inc.stages || {});
  return n;
}

// ===================== Özet: kişiye özel sıradaki adım =====================
function nextStepFor() {
  const m = me();
  if (isAdmin()) { const pr = S.competencies.filter(c => c.status === "INCELEMEDE").length; if (pr) return { title: `${pr} teknik beceri İK onayı bekliyor`, text: "Kütüphanede \"İK onayı bekleyen\" listesinden inceleyin: onaylayın ya da notla geri gönderin.", link: "kutuphane" }; const { stages, current } = computeStages(); const s = stages[current]; return { title: `İK olarak sıradaki adım: ${s.title}`, text: s.guidance[0], link: s.link }; }
  if (!m) return null;
  const a = currentAssessment(m.id, false); const team = teamOf(m.id);
  const pendTeam = S.evidence.filter(e => team.includes(e.personId) && e.status === "SUNULDU").length;
  if (pendTeam) return { title: `Ekibinizden ${pendTeam} kanıt karar bekliyor`, text: "Ekibimin kanıtları sayfasında kabul / ek bilgi / red verin; gerekçe yazın.", link: "ekipkanit" };
  if (team.length && S.techProcess.active) { const mineT = S.competencies.filter(c => c.kind === "TEKNIK" && c.ownerUnitId === reportingUnit(m.id)); const ret = mineT.filter(c => c.status === "TASLAK" && c.reviewNote).length; if (ret) return { title: `${ret} teknik beceri İK notuyla geri geldi`, text: "Teknik beceri tanımlama sayfasında notu okuyup düzeltin ve yeniden İK onayına gönderin.", link: "teknik" }; if (mineT.filter(c => c.status !== "TASLAK" || !c.reviewNote).length < 8 && !mineT.some(c => c.status === "INCELEMEDE" || c.status === "AKTIF")) return { title: "İK teknik beceri tanımlama sürecini başlattı", text: `Müdürlüğünüz için 8–12 teknik beceriyi göstergeleriyle tanımlayıp İK onayına gönderin${S.techProcess.deadline ? ` (son tarih ${fmtDate(S.techProcess.deadline)})` : ""}.`, link: "teknik" }; }
  const pendReq = S.requests.filter(r => team.includes(r.personId) && r.status === "BEKLIYOR").length;
  if (pendReq) return { title: `Ekibinizden ${pendReq} yetkinlik talebi onay bekliyor`, text: "Yetkinlik talepleri sayfasında işin parçası olanları onaylayın, hedefi gerekirse düzeltin.", link: "talepler" };
  if (isUpper()) { let l5 = 0, ap = 0; S.assessments.forEach(x => x.lines.forEach(l => { if (x.status === "UST_DOGRULAMADA" && l.l5Candidate && l.l5Validated == null) l5++; if (l.appealFlag) ap++; })); if (l5 || ap) return { title: `${l5} seviye 5 onayı, ${ap} itiraz bekliyor`, text: "Üst doğrulama / itiraz sayfasında kanıt üzerinden karar verin.", link: "ust" }; }
  if (team.length) { const as = team.map(pid => currentAssessment(pid, false)).filter(Boolean); const v = as.filter(x => x.status === "OZ_BEYAN_TAMAM").length; const mu = as.filter(x => x.status === "YONETICI_TAMAM").length; if (v) return { title: `${v} ekip üyesi öz-beyanını tamamladı, değerlendirmenizi bekliyor`, text: "Ekibimin değerlendirmeleri sayfasında her kişi için görüşünüzü yazın ve doğrulamayı tamamlayın.", link: "ekipdeg" }; if (mu) return { title: `${mu} kişi için mutabakat gönderilmedi`, text: "Görüşmeyi yapıp mutabık seviyeyi gönderin (sarı satırlarda görüşme zorunlu).", link: "ekipdeg" }; }
  if (a) { if (a.status === "MUTABAKATTA") return { title: "Mutabakat yanıtınız bekleniyor", text: "Yöneticinizin gönderdiği mutabık seviyeyi onaylayın ya da gerekçeli itiraz edin.", link: "degerlendirme" }; if (FINAL.includes(a.status)) { const pl = S.plans.find(p => p.personId === m.id); if (!pl || !pl.actions.length) return { title: "Gelişim planınızı yazın", text: "İlk 3 önceliğiniz için eylem ekleyin; eksik gösterge = yapacağınız iş.", link: "gelisim" }; } }
  const mine = S.evidence.filter(e => e.personId === m.id); const drafts = mine.filter(e => e.status === "TASLAK").length; const ek = mine.filter(e => e.status === "EK_BILGI").length;
